  const head = document.createElement("div"); head.className = "tiny rvhandhead";

  box.appendChild(head);

  for (const c of sortHand(hand, ctx)){

  key.innerHTML = "<span class='rvk played'></span>" + esc(t("rvKeyPlayed")) + (better.size ? " <span class='rvk better'></span>" + esc(t(mk && mk.m === "unlucky" ? "rvKeyHind" : "rvKeyBetter", { c:cardsTxt([...better]) })) : "");
  box.appendChild(key);
  return box;

/* ---------- keyboard: Enter play · S suggest · C clear · L last trick · F fast-forward · Esc close ---------- */
function onKey(e){
  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key === "Enter" ? "enter" : e.key === "Escape" ? "esc" : e.key.length === 1 ? e.key.toLowerCase() : "";
  if (!k) return;
  if (k === "esc"){
    for (const id of ["revOv", "histOv", "tipsOv", "peek"]) if (!$(id).classList.contains("hidden")){ $(id).classList.add("hidden"); return; }
    if (tutOpen()){ closeTut(); return; }
    if (!$("settingsPanel").classList.contains("hidden")){ $("settingsPanel").classList.add("hidden"); return; }
    if (G.asking && G.sel.size){ G.sel = new Set(); G.msg = ""; renderDock(); }
    return;
  }
  if (tutOpen() || tipsOpen() || !$("histOv").classList.contains("hidden") || !$("revOv").classList.contains("hidden") || $("game").classList.contains("hidden")) return;
  if (!$("passOv").classList.contains("hidden")){ if (k === "enter"){ e.preventDefault(); $("passBtn").click(); } return; }
  if (!$("roundOv").classList.contains("hidden")){ if (k === "enter"){ const b = $("roundBox").querySelector("[data-key='enter']"); if (b){ e.preventDefault(); b.click(); } } return; }
  if (k === "l"){ if (G.lastTrick){ if ($("peek").classList.contains("hidden")) showPeek(); else $("peek").classList.add("hidden"); } return; }
  const b = $("actions").querySelector("button[data-key='" + k + "']");
  if (b && !b.disabled){ e.preventDefault(); b.click(); }
}

/* ================= ONLINE ROOMS =================
   one phone hosts and runs the whole game; up to 3 others join with a room
   code. a tiny relay on bryanzhang.pythonanywhere.com passes messages:
   guests send joins, declares and answers to the host; the host sends each
   guest only their own view of the table (their hand, never anyone else's).
   empty seats are computers. solo and pass-and-play never touch the network. */
const RELAY_DEFAULT = "https://bryanzhang.pythonanywhere.com/sj";
const NKEY = "shengji-online-v1";
const NET = { watchers:{}, lastHost:0, quietUntil:0, hbT:null, relay:null, role:null, code:null, token:null, pid:null, seat:null, after:0, v:0, timer:null, alive:false,
  guests:{}, peers:{}, seats:null, pending:null, askSeq:0, lastSent:{}, flushT:null, lobby:null, shownEnd:null, err:"" };
function relayUrl(){
  try { const q = new URLSearchParams(location.search).get("relay"); if (q) return q.replace(/\/$/, ""); } catch(e){}
  return RELAY_DEFAULT;
}
function roomFromUrl(){ try { return (new URLSearchParams(location.search).get("room") || "").toUpperCase().slice(0, 4); } catch(e){ return ""; } }
async function netCall(path, obj, get){
  const url = NET.relay + path;
  const r = get ? await fetch(url + "?" + new URLSearchParams(obj), { cache:"no-store" })
    // text/plain keeps it a "simple" request: no CORS preflight
    : await fetch(url, { method:"POST", headers:{ "Content-Type":"text/plain" }, body:JSON.stringify(obj) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || ("http " + r.status)), { code:j.error || "http" });
  return j;
}
function netSaveId(){ try { localStorage.setItem(NKEY, JSON.stringify({ relay:NET.relay, code:NET.code, token:NET.token, pid:NET.pid, role:NET.role, ts:Date.now() })); } catch(e){} }
function netSavedId(){ try { const o = JSON.parse(localStorage.getItem(NKEY) || "null"); return o && o.role === "guest" && Date.now() - o.ts < 6 * 3600e3 ? o : null; } catch(e){ return null; } }
function netForget(){ try { localStorage.removeItem(NKEY); } catch(e){} }
function netSend(msgs, states){ return netCall("/send", { code:NET.code, token:NET.token, msgs:msgs || [], states:states || null }).catch(() => {}); }

/* ---------- polling ---------- */
function netStart(){
  NET.alive = true; clearTimeout(NET.timer);
  const tick = async () => {
    if (!NET.alive) return;
    try {
      const j = await netCall("/poll", { code:NET.code, token:NET.token, after:NET.after, v:NET.v }, true);
      NET.err = "";
      if (j.peers) NET.peers = j.peers;
      for (const m of j.msgs || []){ NET.after = Math.max(NET.after, m.seq); if (NET.role === "guest") NET.lastHost = Date.now(); onNetMsg(m.from, m.body); }
      if (j.state){ NET.v = j.state.v; NET.lastHost = Date.now(); onNetState(j.state.body); }
      // a guest who hasn't heard from the host in a while: say so instead of just freezing
      if (NET.role === "guest"){ const away = !!(G.M && G.M.winner == null && NET.lastHost && Date.now() - NET.lastHost > 25000); if (away !== !!G.hostAway){ G.hostAway = away; if (G.M) renderDock(); } }
      if (NET.role === "host" && NET.pending) renderDock();   // the take-over button depends on how long a guest has been quiet
    } catch(e){
      NET.err = e.code === "auth" ? "gone" : "net";
      if (e.code === "auth" && NET.role === "guest"){ netStop(); netForget(); guestEnded(t("hostLeft")); return; }
    }
    NET.timer = setTimeout(tick, document.hidden ? 1500 : NET.role === "guest" && G.dealing ? 500 : 650);
  };
  tick();
}
/* host: a heartbeat every 10 s, so guests can tell a quiet table from a host who's gone */
function hostBeat(){
  clearInterval(NET.hbT);
  NET.hbT = setInterval(() => { if (NET.role !== "host" || !NET.alive){ clearInterval(NET.hbT); return; } const msgs = netRemotePids().map(pid => ({ to:pid, body:{ t:"hb" } })); if (msgs.length) netSend(msgs); }, 10000);
}
function netStop(){ NET.alive = false; clearTimeout(NET.timer); clearInterval(NET.hbT); clearTimeout(NET.flushT); NET.flushT = null; }

/* ================= HOST ================= */
async function hostRoom(){
  NET.relay = relayUrl(); NET.err = "";
  const j = await netCall("/create", { name:S.soloName.trim() });
  Object.assign(NET, { role:"host", code:j.code, token:j.token, pid:0, seat:0, after:0, v:0, guests:{}, watchers:{}, peers:{}, pending:null, lastSent:{} });
  NET.seats = [{ type:"me" }, { type:"cpu", diff:S.cpuDiff[1] }, { type:"cpu", diff:S.cpuDiff[2] }, { type:"cpu", diff:S.cpuDiff[3] }];

  const t0 = r.tricks.length;
  if (TALK.cpuTrick === t0) return;
  const w = d.winner, partner = (w + 2) % 4, pts = d.pts || 0;
  const cpu = (s) => G.M.players[s].type === "cpu";
  let said = false;
  const go = (s, k, p) => { if (!said && cpu(s) && Math.random() < p){ cpuSay(s, k, 700); said = true; TALK.cpuTrick = t0; } };
  if (pts >= 20) go(partner, pick(["nice", "👏", "🔥"]), 0.45);
  if (pts >= 20 && killed) go(w, pick(["lucky", "🔥", "😤"]), 0.35);
  if (pts >= 25){ const loser = [(w + 1) % 4, (w + 3) % 4].find(cpu); if (loser != null) go(loser, pick(["😮", "😤", "😭", "hmm"]), 0.3); }
  // a computer whose partner just handed this trick's points to the other team lets them hear about it
  const tr = r.tricks[r.tricks.length - 1];
  if (tr && pts >= 15) for (const p of tr.plays){
    const mate = (p.seat + 2) % 4;
    if (p.seat % 2 !== w % 2 && sumPts(p.cards) >= 10 && cpu(mate)) go(mate, pick(["really", "really", "😭", "😤"]), 0.5);
  }
}
function cpuTalkThrowFail(seat){
  if (G.guest || !G.M) return;
  if (G.M.players[seat].type === "cpu" && Math.random() < 0.6) cpuSay(seat, pick(["oops", "😮"]), 600);
  else { const opp = [(seat + 1) % 4, (seat + 3) % 4].find(s => G.M.players[s].type === "cpu"); if (opp != null && Math.random() < 0.35) cpuSay(opp, "😂", 900); }
}
/* someone said something: a computer might answer */
function cpuReplyTo(seat, k){
  if (G.guest || !G.M) return;
  const partner = (seat + 2) % 4, opps = [(seat + 1) % 4, (seat + 3) % 4];
  const cpu = (s) => G.M.players[s].type === "cpu";
  const replies = { sorry:[partner, ["🙏", "👏"]], nice:[partner, ["👏", "🔥"]], really:[partner, ["sorry", "sorry", "🙏", "😭"]], hurry:[opps[0], ["hmm", "😤"]], gg:[partner, ["gg", "👏"]], lucky:[opps[0], ["😤", "hmm"]], "😂":[opps[1], ["😤"]], "🔥":[partner, ["🔥"]] };
  const r = replies[k]; if (!r || !cpu(r[0]) || Math.random() > 0.55) return;
  cpuSay(r[0], pick(r[1]), 1100);
}

function talkMenuOpen(){ const m = $("talkMenu"); return !!m && !m.classList.contains("hidden"); }

/* ================= DAILY PUZZLE (screen) =================
   one spot a day from REVIEW.makePuzzle: "what do you play?". one answer per
   day, graded 1–3 stars against the best play, a streak, and a share card.
   no server: the date picks the puzzle, so everyone gets the same one. */
const DKEY = "shengji-daily-v1";
const DP = { P:null, sel:new Set(), res:null, date:null, busy:false, showPlayed:false };
function todayStr(){ const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function dailyLoad(){ try { return JSON.parse(localStorage.getItem(DKEY) || "null") || { results:{} }; } catch(e){ return { results:{} }; } }
function dailySave(o){ try { localStorage.setItem(DKEY, JSON.stringify(o)); } catch(e){} }
function dayBefore(s){ const [y, m, d] = s.split("-").map(Number); const x = new Date(y, m - 1, d - 1); return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0"); }
function dailyStreak(){
  const o = dailyLoad(); let d = todayStr(), n = 0;
  if (!o.results[d]) d = dayBefore(d);          // today not played yet: the streak is still alive from yesterday
  while (o.results[d]){ n++; d = dayBefore(d); }
  return n;
}
function prettyDate(s){ const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString(LANG === "zh" ? "zh-CN" : "en-US", { month:"short", day:"numeric" }); }
const starStr = (n) => "⭐".repeat(n) + "☆".repeat(3 - n);
function dailyHomeSub(){
  const r = dailyLoad().results[todayStr()], st = dailyStreak();
  return r ? t("dailyDone", { s:starStr(r.stars), n:st }) : st ? t("dailySubStreak", { n:st }) : t("dailySub");
}

async function openDaily(){
  setupStep = "daily"; DP.sel = new Set(); DP.res = null; DP.showPlayed = false;
  const date = todayStr();
  if (!DP.P || DP.date !== date){
    DP.P = null; DP.date = date; DP.busy = true; renderSetup();
    await new Promise(r => setTimeout(r, 30));   // let "dealing…" paint first
    try { DP.P = await REVIEW.makePuzzle(date); } catch(e){ console.error(e); DP.P = null; }
    DP.busy = false;
  }
  const prev = dailyLoad().results[date];
  if (DP.P && prev){ DP.sel = new Set(prev.ids); DP.res = REVIEW.gradePuzzle(DP.P, prev.ids.map(id => CARDS[id])); }
  if (setupStep === "daily") renderSetup();
}
function pzLabel(seat){ return t(["pzYou", "pzRight", "pzPartner", "pzLeft"][(seat - DP.P.d.seat + 4) % 4]); }
function pzCard(c, ctx, o){
  o = o || {};
  return cardEl(c, Object.assign({ ctx, plain:true, cls:((isTrump(c, ctx) ? "trump " : "") + (o.cls || "")).trim() }, o.w ? { w:o.w } : {}, o.onClick ? { onClick:o.onClick } : {}));
}
function renderDaily(box){
  let html = '<div class="panel daily"><h2>🧩 ' + esc(t("dailyTitle", { d:prettyDate(DP.date || todayStr()) })) + "</h2>";
  if (DP.busy || !DP.P){
    html += "<p>" + esc(DP.busy ? t("dailyDealing") : t("dailyFail")) + '</p><div class="row"><button class="btn ghost" id="backBtn">' + esc(t("back")) + "</button></div></div>";
    box.innerHTML = html; $("backBtn").addEventListener("click", () => { setupStep = "home"; renderSetup(); }); return;
  }
  const P = DP.P, D = P.d, ctx = D.ctx, R = P.R;
  const myTeam = D.seat % 2, hosting = myTeam === R.declTeam;
  html += '<p class="pzctx">' + esc(t("pzSituation", { s:R.trump ? SUIT_SYM[R.trump] + " " + suitName(R.trump) : t("noTrump"), l:LEVEL_NAMES[R.level], k:D.t + 1 })) + "<br>" +
    esc(t(hosting ? "pzHosting" : "pzAttacking", { p:D.oppBefore, h:pzLabel(R.declarer) })) + "</p>";
  html += '<div id="pzTrick" class="pztrick"></div>';
  html += '<p class="tiny" id="pzAfter"></p>';
  html += '<div class="row"><button class="linkbtn" id="pzPlayedBtn"></button></div><div id="pzPlayed" class="pzplayed"></div>';
  html += '<h3 class="pzh">' + esc(t("pzYourHand", { n:D.hand.length })) + '</h3><div id="pzHand" class="pzhand"></div>';
  html += '<p class="err" id="pzErr"></p><div id="pzRes"></div><div class="row" id="pzBtns"></div></div>';
  box.innerHTML = html;
  // the trick so far
  const tr = $("pzTrick");
  if (!D.trick.length){ tr.innerHTML = '<p class="tiny">' + esc(t("pzYouLead")) + "</p>"; }
  for (const p of D.trick){
    const row = document.createElement("div"); row.className = "rvplay";
    const nm = document.createElement("span"); nm.className = "rvname"; nm.textContent = pzLabel(p.seat); row.appendChild(nm);
    const cs = document.createElement("span"); cs.className = "rvcards"; for (const c of p.cards) cs.appendChild(pzCard(c, ctx, { w:30 })); row.appendChild(cs);
    tr.appendChild(row);
  }
  const voidsTxt = [];
  for (let s = 0; s < 4; s++) if (s !== D.seat && D.voids[s] && D.voids[s].size) voidsTxt.push(t("pzVoid", { n:pzLabel(s), s:[...D.voids[s]].map(e => e === "T" ? t("trumpLbl") : SUIT_SYM[e]).join(" ") }));
  $("pzAfter").textContent = (D.after.length ? t("pzStill", { n:D.after.map(pzLabel).join(", ") }) : t("pzLastToPlay")) + (voidsTxt.length ? " · " + voidsTxt.join(" · ") : "");
  // cards played so far (counting aid), and the kitty if you buried it
  const pb = $("pzPlayedBtn"); pb.textContent = (DP.showPlayed ? "▾ " : "▸ ") + t("pzPlayed", { n:D.playedIds.length });
  pb.addEventListener("click", () => { DP.showPlayed = !DP.showPlayed; renderSetup(); });
  if (DP.showPlayed){
    const pl = $("pzPlayed"); const groups = {};
    for (const id of D.playedIds){ const c = CARDS[id]; const e = effSuit(c, ctx); (groups[e] = groups[e] || []).push(c); }
    for (const e of ["T", "S", "H", "C", "D"]){
      if (!groups[e]) continue;
      const row = document.createElement("div"); row.className = "pzprow";
      const lb = document.createElement("span"); lb.className = "pzplbl"; lb.textContent = e === "T" ? t("trumpLbl") : SUIT_SYM[e]; row.appendChild(lb);
      for (const c of sortHand(groups[e], ctx)) row.appendChild(pzCard(c, ctx, { w:22 }));
      pl.appendChild(row);
    }
    if (D.seat === R.declarer && R.buried){
      const row = document.createElement("div"); row.className = "pzprow";
      const lb = document.createElement("span"); lb.className = "pzplbl"; lb.textContent = t("reBottom"); row.appendChild(lb);
      for (const c of R.buried) row.appendChild(pzCard(c, ctx, { w:22 }));
      pl.appendChild(row);
    }
  }
  // your hand
  const lead = D.trick.length ? classifyLead(D.trick[0].cards, ctx) : null;
  let allowed = null;
  if (lead){ const req = followReq(D.hand, lead, ctx); if (!req.all) allowed = new Set(req.hs.map(c => c.id)); else if (!DP.res && !DP.sel.size) req.hs.forEach(c => DP.sel.add(c.id)); }
  const best = new Set(DP.res ? DP.res.stars < 3 ? P.best.o.map(c => c.id) : [] : []);
  const hb = $("pzHand");
  for (const c of sortHand(D.hand, ctx)){
    const cls = (DP.sel.has(c.id) ? "sel " : "") + (allowed && !allowed.has(c.id) ? "dim " : "") + (best.has(c.id) ? "rvbetter" : "");
    hb.appendChild(pzCard(c, ctx, { w:40, cls, onClick:DP.res ? null : (x) => { DP.sel.has(x.id) ? DP.sel.delete(x.id) : DP.sel.add(x.id); sndPick(); renderSetup(); } }));
  }
  const btns = $("pzBtns");
  const add = (label, cls, fn, dis) => { const b = document.createElement("button"); b.className = "btn " + (cls || ""); b.textContent = label; b.disabled = !!dis; b.addEventListener("click", fn); btns.appendChild(b); return b; };
  if (!DP.res){
    const picked = D.hand.filter(c => DP.sel.has(c.id));
    add(t("play") + (picked.length ? " · " + picked.length : ""), "good", () => dailySubmit(picked), !picked.length || (lead && picked.length !== lead.n));
    add(t("clear"), "ghost", () => { DP.sel = new Set(); renderSetup(); }, !picked.length);
  } else {
    renderDailyResult($("pzRes"));
    add(t("dailyShare"), "", dailyShare);
  }
  add(t("back"), "ghost", () => { setupStep = "home"; renderSetup(); });
}
function dailySubmit(picked){
  const P = DP.P, D = P.d, ctx = D.ctx, err = $("pzErr");
  if (D.trick.length){
    const why = followProblem(picked, D.hand, classifyLead(D.trick[0].cards, ctx), ctx);
    if (why){ const lead = classifyLead(D.trick[0].cards, ctx); err.textContent = t({ count:"pCount", mustSuitAll:"pMustSuitAll", mustSuit:"pMustSuit", mustPairs:"pMustPairs", mustTractor:"pMustTractor" }[why] || "pCount", { n:lead.n, s:suitName(lead.eff) }); sndBad(); return; }
  } else if (!classifyLead(picked, ctx)){ err.textContent = t("pzBadLead"); sndBad(); return; }
  DP.res = REVIEW.gradePuzzle(P, picked);
  const o = dailyLoad(); o.results[DP.date] = { stars:DP.res.stars, ids:picked.map(c => c.id) }; dailySave(o);
  if (DP.res.stars === 3) jingleUp(); else if (DP.res.stars === 2) jingleFlat(); else jingleDown();
  renderSetup();
}
/* why the best play is best, in the game's own suggest words */
function pzExplain(cards){
  const P = DP.P, D = P.d, sv = G.M;
  G.M = { players:[0, 1, 2, 3].map(s => ({ name:pzLabel(s) })) };
  try { return explainPlay(null, cards, { seat:D.seat, hand:D.hand, ctx:D.ctx, trick:D.trick, playedIds:D.playedIds, voids:D.voids, declTeam:P.R.declTeam, declarer:P.R.declarer, tricks:[], round:P.R.round, counts:D.counts }); }
  catch(e){ return ""; } finally { G.M = sv; }
}
function renderDailyResult(box){
  const P = DP.P, r = DP.res, ctx = P.d.ctx;
  const head = r.stars === 3 ? t("pzBest") : r.stars === 2 ? t("pzClose", { p:Math.round(r.loss) }) : t("pzMiss", { p:Math.round(r.loss) });
  let html = '<div class="pzres s' + r.stars + '"><div class="pzstars">' + starStr(r.stars) + "</div><b>" + esc(head) + "</b>";
  if (r.stars < 3){
    html += '<div class="rvcompare" id="pzCmp"></div>';
    if (r.why) html += "<p>" + esc(t(r.why.why, { b:cardsTxt(r.why.better), p:r.why.p, pct:r.why.pct })) + "</p>";
  } else {
    const w = pzExplain(r.mine.o); if (w) html += "<p>" + esc(w) + "</p>";
  }
  html += '<p class="tiny">' + esc(t("pzStreak", { n:dailyStreak() })) + " · " + esc(t("pzTomorrow")) + "</p></div>";
  box.innerHTML = html;
  if (r.stars < 3){
    const cmp = $("pzCmp");
    cmp.appendChild(miniCards(r.mine.o.map(c => c.id), ctx, 30)); const ar = document.createElement("span"); ar.textContent = " → "; cmp.appendChild(ar); cmp.appendChild(miniCards(P.best.o.map(c => c.id), ctx, 30));
  }
}
async function dailyShare(){
  const r = DP.res; if (!r) return;
  const link = location.href.split("?")[0].split("#")[0] + "?daily=1";
  const text = t("dailyShareText", { d:prettyDate(DP.date), s:starStr(r.stars), n:dailyStreak() });
  try { if (navigator.share) { await navigator.share({ title:t("title"), text, url:link }); return; } } catch(e){ if (e && e.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(text + "\n" + link); const b = [...document.querySelectorAll("#pzBtns button")].find(x => x.textContent === t("dailyShare")); if (b) b.textContent = t("pbCopied"); } catch(e){}
}

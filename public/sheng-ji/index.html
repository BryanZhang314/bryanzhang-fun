<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>升级 · 80 points</title>
<meta name="description" content="升级 (Sheng Ji / 80 points): the classic four-player, two-deck trick-taking game. Play solo against three computers, online with friends, or try the daily puzzle.">
<style>
:root{
  --bg:#f3c6cf; --bg-soft:#f9dde3; --panel:#fbe9ed; --panel-deep:#f6d3db;
  --ink:#3c432e; --ink-soft:#646a52; --ink-faint:#8a8f76; --line:#d9a7b2;
  --btn:#3c432e; --btn-text:#f9dde3; --red:#b23a30; --dark:#2f2c27; --face:#fffdf8;
  --gold:#b07d2b; --good:#4a7a3a;
  --felt:#4b5a3c; --felt-deep:#3a4730; --felt-line:#6b7a57;
  --shadow:0 2px 6px rgba(60,40,40,.2); --shadow-lg:0 10px 28px rgba(60,40,40,.3);
  --cw:52px;  /* hand card width */
  --tw:36px;  /* trick card width */
  --back-img:none;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:"Nunito",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;}
button{font-family:inherit;cursor:pointer;touch-action:manipulation;}
.hidden{display:none !important;}
.nojs{max-width:560px;margin:2rem auto;padding:1.2rem;background:#fbe9ed;border:2px solid #3c432e;border-radius:12px;font-family:system-ui,sans-serif;color:#3c432e;line-height:1.5;}
.nojs h1{margin:.2rem 0 .6rem;}
.btn{display:inline-block;border:2px solid var(--ink);background:var(--btn);color:var(--btn-text);font-weight:800;font-size:1rem;padding:.6rem 1.2rem;border-radius:6px;transition:transform .08s,opacity .15s;}
.btn:hover:not(:disabled){transform:translateY(-1px);}
.btn:disabled{opacity:.38;cursor:not-allowed;}
.btn.ghost{background:transparent;color:var(--ink);}
.btn.small{padding:.32rem .7rem;font-size:.85rem;}
.btn.good{background:var(--good);border-color:var(--good);color:#fff;}
.btn.danger{background:transparent;color:var(--red);border-color:var(--red);}
.tiny{font-size:.85rem;color:var(--ink-soft);}
.wrap{max-width:1100px;margin:0 auto;padding:.6rem .75rem 1.2rem;}

/* ---------- setup ---------- */
h1.title{font-size:clamp(2.2rem,7vw,3.6rem);font-weight:900;margin:.3rem 0 .1rem;line-height:1.05;}
.tagline{font-size:1.05rem;color:var(--ink-soft);max-width:38rem;line-height:1.45;margin:.4rem 0 1rem;}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;}
.panel h2{margin:.1rem 0 .7rem;font-size:1.2rem;font-weight:900;}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.7rem;}
.choice{text-align:left;background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:1rem 1.1rem;font-weight:900;font-size:1.15rem;color:var(--ink);}
.choice span{display:block;font-weight:700;font-size:.9rem;color:var(--ink-soft);margin-top:.2rem;}
.choice:hover{transform:translateY(-2px);}
.choice.resume{border-color:var(--gold);}
.row{display:flex;gap:.55rem;align-items:center;flex-wrap:wrap;margin:.55rem 0;}
.row .lbl{font-size:.85rem;font-weight:800;color:var(--ink-soft);min-width:6.5rem;}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:6px;overflow:hidden;flex-wrap:wrap;}
.seg button{border:0;background:transparent;color:var(--ink);font-weight:800;padding:.4rem .75rem;font-size:.9rem;}
.seg button.on{background:var(--ink);color:var(--btn-text);}
.seg button + button{border-left:2px solid var(--ink);}
.seatrow{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;border:1px solid var(--line);background:var(--bg-soft);border-radius:8px;padding:.5rem .6rem;margin:.4rem 0;}
.seatrow .sn{font-weight:900;min-width:5.6rem;line-height:1.15;}
.seatrow .sn small{display:block;font-size:.72rem;color:var(--ink-soft);font-weight:700;}
.teambox{border:2.5px solid var(--good);border-radius:12px;padding:.45rem .6rem .2rem;margin:.6rem 0;background:#f4f8ef;}
.teambox.opp{border-color:var(--red);background:#fdf1ef;}
.teamhd{font-weight:900;font-size:1rem;display:flex;gap:.5rem;align-items:baseline;flex-wrap:wrap;}
.teambox.mine .teamhd{color:var(--good);} .teambox.opp .teamhd{color:var(--red);}
.teamhd .tiny{font-weight:700;}
.seatrow input{font-family:inherit;font-size:.98rem;font-weight:700;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:5px;padding:.38rem .5rem;flex:1;min-width:8rem;}
.err{color:var(--red);font-weight:800;min-height:1.2em;}
.backs{display:flex;gap:.45rem;flex-wrap:wrap;}
.backpick{border:3px solid transparent;border-radius:8px;padding:2px;background:transparent;line-height:0;}
.backpick img{width:44px;height:58px;object-fit:cover;border-radius:5px;box-shadow:var(--shadow);}
.backpick.on{border-color:var(--ink);background:#fff;}
.tutprompt{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;background:#fff;border:2px solid var(--gold);border-radius:10px;padding:.6rem .8rem;margin:.6rem 0 1rem;font-weight:700;line-height:1.4;}
.tutprompt .grow{flex:1;min-width:200px;}
.linkbtn{background:none;border:0;color:var(--ink-soft);font-weight:800;text-decoration:underline;padding:.3rem;}

/* ---------- game shell ---------- */
#game{display:flex;flex-direction:column;max-width:980px;margin:0 auto;}
.topbar{display:flex;align-items:center;gap:.35rem;flex-wrap:wrap;padding:.35rem .5rem;}
.topbar .logo{font-weight:900;font-size:1.05rem;margin-right:auto;white-space:nowrap;}
.topbar .tools{display:flex;gap:.3rem;flex-wrap:wrap;align-items:center;}
.topbar .btn.small{padding:.28rem .55rem;font-size:.8rem;}
@media (max-height:700px){ .statusline{font-size:.84rem;} .actions{margin:.25rem 0;} .scorebar .tiny{display:none;} }
@media (max-width:399px){ .topbar .logo{flex-basis:100%;} .topbar .tools{width:100%;} .topbar .wide{display:none;} .topbar .btn.small{padding:.26rem .45rem;font-size:.78rem;} }
.setwrap{position:relative;}
.settings{position:absolute;right:0;top:calc(100% + 6px);z-index:60;width:min(330px,92vw);background:var(--panel);border:2px solid var(--ink);border-radius:10px;box-shadow:var(--shadow-lg);padding:.7rem .8rem;}
.settings .row .lbl{min-width:5.5rem;}
.board{padding:0 .5rem;}
.scorebar{display:grid;grid-template-columns:1fr 1fr;gap:.35rem;margin-bottom:.35rem;}
.teamchip{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:.3rem .55rem;font-size:.86rem;line-height:1.25;min-width:0;}
.teamchip.decl{border-color:var(--ink);background:#fff;}
.teamchip .tn{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.teamchip .tl{font-weight:900;font-size:1.05rem;}
.teamchip .tag{font-size:.62rem;font-weight:900;text-transform:uppercase;letter-spacing:.04em;border-radius:99px;padding:.04rem .4rem;background:var(--panel-deep);border:1px solid var(--line);margin-left:.25rem;vertical-align:1px;}
.infobar{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;font-size:.85rem;font-weight:800;margin-bottom:.35rem;}
.trumpchip{background:#fff;border:2px solid var(--gold);border-radius:99px;padding:.08rem .55rem;}
.trumpchip .sym{font-size:1.05rem;}
.red{color:var(--red);}
.race{flex:1 1 100%;min-width:150px;}
.racebar{position:relative;height:12px;background:#fff;border:1.5px solid var(--ink);border-radius:99px;overflow:hidden;}
.racefill{position:absolute;left:0;top:0;bottom:0;background:var(--red);transition:width .4s ease;}
.racetick{position:absolute;top:0;bottom:0;width:1.5px;background:var(--ink);opacity:.55;}
.racetick.k80{opacity:1;width:2.5px;}
.racelbl{font-size:.75rem;font-weight:800;color:var(--ink-soft);display:flex;justify-content:space-between;}

/* ---------- felt table ---------- */
.felt{position:relative;background:radial-gradient(ellipse at center,var(--felt) 0%,var(--felt-deep) 100%);border:3px solid var(--felt-line);border-radius:22px;box-shadow:inset 0 0 30px rgba(0,0,0,.25);color:#f3efe2;}
.felt .seatlbl{position:absolute;font-size:.78rem;font-weight:800;text-align:center;line-height:1.2;max-width:31%;}
.felt .seatlbl .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;}
.felt .seatlbl .ct{opacity:.8;font-weight:700;}
.felt .seatlbl.turn .nm{color:#ffe7a3;text-shadow:0 0 6px rgba(255,220,120,.6);}
.felt .seatlbl .ctag{background:#f3efe2;color:var(--felt-deep);margin-left:.2rem;}
.felt .seatlbl .dtag{display:inline-block;font-size:.6rem;font-weight:900;letter-spacing:.05em;background:var(--gold);color:#fff;border-radius:99px;padding:.02rem .4rem;margin-top:.1rem;}
.minis{display:flex;justify-content:center;margin-top:.15rem;}
.mini{width:16px;height:22px;border-radius:3px;background:var(--back-img) center/cover,#ccc;border:1px solid rgba(255,255,255,.6);margin-left:-9px;box-shadow:0 1px 2px rgba(0,0,0,.3);}
.mini:first-child{margin-left:0;}
.slot{position:absolute;display:flex;justify-content:center;align-items:center;min-height:calc(var(--tw)*1.4);}
.slot .tcards{display:flex;}
.slot .tcards .card{margin-left:calc(var(--tw)*-0.55);}
.slot .tcards .card:first-child{margin-left:0;}
.slot.win .tcards{filter:drop-shadow(0 0 7px #ffd75e) drop-shadow(0 0 2px #ffd75e);}
.feltmsg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;font-weight:900;font-size:.95rem;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.4);width:60%;}
.feltbtns{position:absolute;right:.4rem;bottom:.35rem;display:flex;gap:.3rem;}
.feltbtn{background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.55);color:#f3efe2;font-weight:800;font-size:.72rem;border-radius:99px;padding:.18rem .55rem;}
.deckstack{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);}

/* ---------- cards ---------- */
.card{--w:var(--cw);width:var(--w);height:calc(var(--w)*1.4);background:var(--face);border:1.5px solid #cbb9a8;border-radius:calc(var(--w)*.12);position:relative;flex:none;box-shadow:var(--shadow);font-weight:900;user-select:none;-webkit-user-select:none;color:var(--dark);padding:0;touch-action:manipulation;transition:transform .12s ease;}
.card.t{--w:var(--tw);}
.card.red{color:var(--red);}
.card .cr{position:absolute;top:2px;left:3px;line-height:.95;text-align:center;font-size:calc(var(--w)*.3);letter-spacing:-.04em;}
.card .cr .cs{display:block;font-size:calc(var(--w)*.27);}
.card .pip{position:absolute;right:6%;bottom:5%;font-size:calc(var(--w)*.46);line-height:1;}
.card .pts{position:absolute;top:2px;right:2px;background:var(--gold);color:#fff;border-radius:99px;font-size:calc(var(--w)*.2);min-width:calc(var(--w)*.34);height:calc(var(--w)*.3);display:flex;align-items:center;justify-content:center;padding:0 2px;font-weight:900;}
.card.trump{box-shadow:var(--shadow),inset 0 -4px 0 #e4c27a;}
.card.joker{background:linear-gradient(150deg,#fff8ec,#ffe5cf);}
.card.joker .jk{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;}
.card.joker .jk .star{font-size:calc(var(--w)*.48);line-height:1;}
.card.joker .jk .w{font-size:calc(var(--w)*.2);letter-spacing:.02em;}
.card.joker.big{color:var(--red);}
.card.back{background:var(--back-img) center/cover,#ddd;border-color:#fff;}
.card.sel{transform:translateY(calc(var(--w)*-.28));border-color:var(--ink);box-shadow:var(--shadow-lg);outline:2.5px solid var(--ink);outline-offset:1px;}
.card.dim{filter:grayscale(.5) brightness(.82);opacity:.55;}
.card.hl{outline:3px solid var(--gold);outline-offset:1px;}
.card.new{animation:pop .3s ease;outline:2.5px solid var(--gold);outline-offset:1px;}
@keyframes pop{from{transform:translateY(-10px) scale(.9);opacity:.2;}to{transform:none;opacity:1;}}

/* ---------- dock: status, actions, hand ---------- */
.dock{padding:.35rem .5rem .5rem;}
.statusline{font-weight:800;font-size:.92rem;line-height:1.3;min-height:1.3em;display:flex;gap:.4rem;align-items:flex-start;}
.statusline .msg{flex:1;}
.statusline .warn{color:var(--red);}
.actions{display:flex;gap:.35rem;flex-wrap:wrap;margin:.35rem 0;}
.actions .btn{padding:.42rem .8rem;font-size:.92rem;}
.hand{position:relative;margin-top:calc(var(--cw)*.32);overflow-x:clip;}
.handrow{position:relative;height:calc(var(--cw)*1.4);}
.handrow + .handrow{margin-top:calc(var(--cw)*-.55);}
.handrow .card{position:absolute;top:0;}
.handrow .card.clickable{cursor:pointer;}

/* ---------- log ---------- */
.logpanel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.5rem .7rem;margin:.5rem;}
.logpanel .lh{display:flex;justify-content:space-between;align-items:center;}
.logpanel h3{margin:0;font-size:.95rem;}
.logpanel ul{list-style:none;margin:.4rem 0 0;padding:0;max-height:260px;overflow:auto;}
.logpanel li{padding:.28rem 0;border-top:1px dashed var(--line);font-size:.86rem;font-weight:600;line-height:1.35;}
.logpanel li:first-child{border-top:0;}
.logpanel.collapsed ul{display:none;}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;background:var(--bg);z-index:80;display:flex;align-items:center;justify-content:center;padding:1rem;overflow:auto;}
.overlay .box{max-width:560px;width:100%;text-align:center;margin:auto;}
.overlay h2{font-size:clamp(1.5rem,5vw,2.2rem);font-weight:900;margin:.2rem 0 .4rem;}
.overlay p{color:var(--ink-soft);font-weight:600;line-height:1.45;}
.passback{width:120px;height:168px;border-radius:10px;background:var(--back-img) center/cover,#ddd;box-shadow:var(--shadow-lg);margin:0 auto .8rem;}
.bottomrow{display:flex;justify-content:center;gap:.25rem;flex-wrap:wrap;margin:.6rem 0;}
.bottomrow .card{--w:40px;}
.flip{animation:flip .5s ease both;}
@keyframes flip{0%{transform:rotateY(90deg);}100%{transform:rotateY(0);}}
.stamp{display:inline-block;font-size:2.2rem;font-weight:900;color:var(--red);border:4px solid var(--red);border-radius:10px;padding:.05rem .6rem;transform:rotate(-8deg);animation:stamp .45s cubic-bezier(.2,1.6,.4,1) both;animation-delay:.6s;}
@keyframes stamp{from{transform:scale(2.4) rotate(-8deg);opacity:0;}to{transform:scale(1) rotate(-8deg);opacity:1;}}
.restats{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.7rem .9rem;margin:.7rem 0;text-align:left;font-weight:700;line-height:1.6;}
.restats .big{font-size:1.5rem;font-weight:900;}
.peek{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:1rem;}
.peek .box{background:var(--panel);border:2px solid var(--ink);border-radius:12px;padding:.8rem;max-width:520px;width:100%;}
.peek .pl{display:flex;align-items:center;gap:.5rem;padding:.3rem 0;border-top:1px dashed var(--line);}
.peek .pl:first-of-type{border-top:0;}
.peek .pl .who{min-width:5.5rem;font-weight:800;font-size:.85rem;}
.peek .pl.win .who{color:var(--gold);}
.peek .pl .tcards{display:flex;gap:2px;flex-wrap:wrap;}

/* ---------- round-end card review ---------- */
.revteam{font-weight:900;font-size:1.05rem;margin:.7rem 0 .15rem;text-align:left;}
.revteam:first-child{margin-top:0;}
.revseat{margin:.1rem 0 .55rem;text-align:left;}
.revwho{font-weight:800;font-size:.92rem;margin-bottom:.2rem;}
.revrow{display:flex;overflow-x:auto;padding:.1rem 0 .25rem;}
.revrow .card{--w:30px;}
.revrow .card + .card{margin-left:-18px;}

/* ---------- tutorial ---------- */
.tutbox{max-width:720px !important;text-align:left !important;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem;box-shadow:var(--shadow-lg);max-height:94vh;overflow:auto;}
.tuthead{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;}
.tuthead h2{margin:0;flex:1;font-size:clamp(1.3rem,4vw,1.8rem);}
.tutmeta{font-size:.8rem;font-weight:900;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin:.3rem 0 .6rem;}
.tutbody p{line-height:1.55;font-weight:600;margin:.4rem 0;}
.tutdemo{background:var(--felt);border-radius:12px;padding:.7rem;margin:.6rem 0;color:#f3efe2;}
.tutdemo .lbl{font-size:.8rem;font-weight:800;opacity:.85;margin-bottom:.35rem;}
.tutrow{display:flex;gap:.3rem;flex-wrap:wrap;align-items:flex-end;min-height:calc(var(--cw)*1.4 + 12px);padding-top:12px;}
.tutmath{font-weight:900;min-height:1.4em;margin:.5rem 0;}
.tutmath .ok{color:var(--good);} .tutmath .bad{color:var(--red);}
.tutnav{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-top:.8rem;border-top:1px dashed var(--line);padding-top:.7rem;}
.tutnav .sp{flex:1;}
.quiz{display:flex;gap:.4rem;flex-wrap:wrap;margin:.4rem 0;}

/* ---------- full size vs fit ---------- */
body.full{--cw:64px;--tw:46px;}
body.full .felt{min-height:360px;}
@media (prefers-reduced-motion: reduce){ *{animation:none !important;transition:none !important;} }

/* ---- Nov 10: trump box (top left), bury view, history, tips, confetti ---- */
.trumpbox{display:flex;align-items:center;gap:.45rem;background:#fff;border:2.5px solid var(--gold);border-radius:12px;padding:.22rem .5rem;box-shadow:var(--shadow);order:-1;}
.trumpbox.tbd{border-style:dashed;}
.trumpbox .tbl{display:flex;flex-direction:column;line-height:1.1;min-width:0;}
.trumpbox .k{font-size:.62rem;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);}
.trumpbox .v{font-size:1.12rem;font-weight:900;white-space:nowrap;}
.trumpbox .v.red{color:var(--red);}
.trumpbox .w{font-size:.72rem;font-weight:800;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw;}
.trumpbox .tbc{display:flex;gap:2px;}
.trumpbox .tbc .card{--w:clamp(26px, calc(var(--tw) * .95), 40px);}
.logpanel .lh .sp{flex:1;}
.logpanel .lh .btn + .btn{margin-left:.3rem;}
body.burying .felt{display:none;}
body.burying .race{display:none;}
.kittray{background:var(--panel-deep);border:2px dashed var(--ink-soft);border-radius:12px;padding:.3rem .35rem .35rem;margin-bottom:.4rem;}
.kittray .kh{font-size:.82rem;margin-bottom:.25rem;}
.kittray .warn{color:var(--red);font-weight:900;}
.kittray .krow{display:flex;gap:3px;justify-content:center;flex-wrap:nowrap;}
.kittray .kslot{border:2px dashed rgba(0,0,0,.2);border-radius:8px;flex:none;}
.kittray .card.clickable{cursor:pointer;}
.buryrow{position:relative;height:calc(var(--cw)*1.4);}
.buryrow + .buryrow{margin-top:calc(var(--cw)*-.42);}
.buryrow .card{position:absolute;top:0;cursor:pointer;}
.buryrow .blbl{position:absolute;left:0;top:4px;width:26px;text-align:center;font-weight:900;font-size:1.05rem;}
.buryrow .blbl.red{color:var(--red);}
.buryrow .blbl.trump{font-size:.6rem;text-transform:uppercase;letter-spacing:.04em;color:var(--gold);writing-mode:vertical-rl;transform:rotate(180deg);height:calc(var(--cw)*.9);}
.buryrow .bempty{position:absolute;left:36px;top:6px;opacity:.4;}
body.burying .hand{margin-top:.2rem;}
.histwrap{overflow-x:auto;}
table.hist{border-collapse:collapse;width:100%;font-size:.86rem;font-weight:700;}
table.hist th,table.hist td{border-bottom:1px solid var(--line);padding:.3rem .4rem;text-align:left;white-space:nowrap;}
table.hist th{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);}
table.hist tr.flip td{background:#fff6e0;}
table.hist .red{color:var(--red);}
.tipsbody h3{margin:.8rem 0 .3rem;font-size:1rem;}
.tipsbody h3:first-child{margin-top:0;}
.tipsbody ul{margin:0;padding-left:1.1rem;line-height:1.5;font-weight:600;}
.tipsbody li{margin-bottom:.25rem;}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:200;overflow:hidden;}
#confetti i{position:absolute;top:-20px;width:9px;height:9px;border-radius:2px;animation:confall linear forwards;}
@keyframes confall{0%{transform:translate(0,0) rotate(0);opacity:1;}85%{opacity:1;}100%{transform:translate(var(--dx),110vh) rotate(var(--rot));opacity:0;}}
.felt .seatlbl.me{max-width:92%;white-space:nowrap;}
.felt .seatlbl.me .nm{display:inline;}
.felt .seatlbl.me .dtag{margin-top:0;margin-left:.2rem;}
.toast{position:fixed;left:50%;top:26%;transform:translateX(-50%);z-index:150;background:#fff;border:3px solid var(--gold);border-radius:16px;box-shadow:var(--shadow-lg);padding:.6rem 1rem .7rem;text-align:center;min-width:220px;max-width:92vw;animation:toastIn .25s ease;cursor:pointer;}
.toast.mine{border-color:var(--felt-line,#1f6f50);}
.toast.opp{border-color:var(--red);}
.toast .th{font-weight:900;font-size:1rem;}
.toast .tc{display:flex;gap:4px;justify-content:center;margin:.4rem 0;}
.toast .tc:empty{display:none;}
.toast .tt{font-weight:900;font-size:1.25rem;}
.toast .tt.red{color:var(--red);}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-8px) scale(.96);}to{opacity:1;transform:translate(-50%,0) scale(1);}}
.onlinebox{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin:.6rem 0;}
.onlinebox > div{background:#fff;border:2px solid var(--line);border-radius:12px;padding:.55rem .65rem;}
.onlinebox p{margin:.2rem 0 .45rem;}
@media (max-width:480px){ .onlinebox{grid-template-columns:1fr;} }
.roomcode{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;background:#fff;border:2.5px solid var(--gold);border-radius:12px;padding:.4rem .7rem;margin:.3rem 0 .5rem;}
.roomcode .code{font-size:2rem;font-weight:900;letter-spacing:.25em;}

/* ---- round review (Nov 21) ---- */
.rvtabs{margin:.1rem 0 .6rem;}
.rvwork p{margin:.2rem 0 .4rem;font-weight:700;}
.rvaward{background:#fff;border:2px solid var(--gold);border-radius:12px;padding:.5rem .6rem;margin-bottom:.55rem;}
.rvaward .rvat{font-weight:900;font-size:1rem;}
.rvaward .rvtxt{margin:.2rem 0 .35rem;font-weight:600;line-height:1.35;}
.rvtrick{display:flex;flex-direction:column;gap:2px;margin:.2rem 0;}
.rvplay{display:flex;align-items:center;gap:.4rem;font-size:.82rem;}
.rvrest{display:flex;align-items:center;gap:.2rem .4rem;flex-wrap:wrap;min-width:0;}
.rvplay.win .rvname{color:var(--red);}
.rvname{font-weight:800;flex:none;width:7.5em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rvcards{display:inline-flex;}
.rvcards .card + .card{margin-left:-14px;}
.rvmark{font-size:.75rem;font-weight:800;color:var(--ink-soft);}
.rvline{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);padding:.35rem .15rem;font:inherit;font-size:.86rem;font-weight:600;color:inherit;cursor:pointer;}
.rvline.open{background:#fff;}
.rvicons{white-space:nowrap;}
.rvcoach{margin-top:.6rem;}
.rvcoach h3,.rvrecap h3{margin:.3rem 0;font-size:1rem;}
.rvnote{background:var(--panel-deep);border-radius:10px;padding:.45rem .55rem;margin-bottom:.45rem;font-size:.88rem;line-height:1.35;}
.rvcompare{display:flex;align-items:center;margin:.3rem 0 .1rem;}
.rvrecap{background:#fff6e0;border:2px solid var(--gold);border-radius:12px;padding:.4rem .6rem;margin-bottom:.6rem;}
.rvrecap p{margin:.2rem 0;font-size:.88rem;}

.rvhandbox{margin:.2rem 0 .7rem;padding:.55rem .6rem;border:2px dashed var(--line, #c9b98a);border-radius:12px;background:rgba(255,255,255,.55);}
.rvseats{display:flex;flex-wrap:wrap;gap:.3rem;margin-bottom:.4rem;}
.rvseat{font:inherit;font-size:.72rem;font-weight:800;padding:.2rem .55rem;border-radius:999px;border:2px solid var(--ink, #3c4a2a);background:transparent;color:var(--ink, #3c4a2a);cursor:pointer;max-width:11em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rvseat.on{background:var(--ink, #3c4a2a);color:#fff;}
.rvhandhead{margin-bottom:.35rem;}
.rvhand{display:flex;flex-wrap:wrap;gap:3px;}
.rvhand .card.rvplayed{outline:3px solid var(--gold, #c8962e);outline-offset:-1px;transform:translateY(-3px);}
.rvhand .card.rvbetter{outline:3px solid var(--good);outline-offset:-1px;transform:translateY(-3px);}
.rvhand .card.rvdim{opacity:.35;}
.rvhandkey{margin-top:.4rem;display:flex;align-items:center;flex-wrap:wrap;gap:.3rem;}
.rvk{display:inline-block;width:.8rem;height:.8rem;border-radius:3px;margin-left:.2rem;}
.rvk.played{border:3px solid var(--gold, #c8962e);}
.rvk.better{border:3px solid var(--good);}

/* table talk */
.talkbub{position:absolute;z-index:6;background:#fffdf6;color:var(--ink);font-weight:800;font-size:.8rem;padding:.3rem .6rem;border-radius:14px;box-shadow:0 3px 10px rgba(0,0,0,.28);white-space:nowrap;pointer-events:none;animation:talkin .22s ease-out;max-width:46%;overflow:hidden;text-overflow:ellipsis;}
.talkbub.emo{font-size:1.45rem;padding:.1rem .4rem;background:rgba(255,253,246,.92);}
.talkbub::after{content:"";position:absolute;width:10px;height:10px;background:inherit;transform:rotate(45deg);}
.talkbub.p0{left:50%;bottom:30px;transform:translateX(-50%);} .talkbub.p0::after{bottom:-4px;left:calc(50% - 5px);}
.talkbub.p2{left:50%;top:30px;transform:translateX(-50%);} .talkbub.p2::after{top:-4px;left:calc(50% - 5px);}
.talkbub.p1{right:8px;top:48px;} .talkbub.p1::after{top:-4px;right:14px;}
.talkbub.p3{left:8px;top:48px;} .talkbub.p3::after{top:-4px;left:14px;}
@keyframes talkin{from{opacity:0;margin-top:6px;}to{opacity:1;margin-top:0;}}
.talkmenu{position:fixed;left:50%;bottom:calc(var(--cw, 52px) * 2.2 + 70px);transform:translateX(-50%);z-index:60;background:#fffdf6;border:2px solid var(--ink);border-radius:16px;padding:.5rem;box-shadow:0 8px 24px rgba(0,0,0,.3);width:min(92vw,360px);}
.talkmenu .tkp{display:grid;grid-template-columns:1fr 1fr;gap:.3rem;}
.talkmenu .tkp button{font:inherit;font-weight:800;font-size:.82rem;padding:.45rem .3rem;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--ink);}
.talkmenu .tke{display:flex;justify-content:space-between;margin-top:.4rem;}
.talkmenu .tke button{font-size:1.5rem;background:none;border:none;padding:.15rem .3rem;}
.rvexport{gap:.4rem;margin:.1rem 0 .5rem;}

/* daily puzzle */
.choice.daily{border-color:var(--gold);background:linear-gradient(135deg,#fff8e8,#fdeef1);}
.daily .pzctx{margin:.2rem 0 .5rem;line-height:1.45;}
.pztrick{display:flex;flex-direction:column;gap:.25rem;margin:.3rem 0;}
.pzplayed{display:flex;flex-direction:column;gap:.2rem;margin:.2rem 0 .4rem;}
.pzprow{display:flex;flex-wrap:wrap;align-items:center;gap:2px;}
.pzplbl{font-weight:800;font-size:.75rem;min-width:3.2em;}
.pzh{margin:.6rem 0 .3rem;font-size:.95rem;}
.pzhand{display:flex;flex-wrap:wrap;gap:4px;}
.pzhand .card.sel{transform:translateY(-8px);box-shadow:0 0 0 3px var(--gold);}
.pzhand .card.dim{opacity:.38;}
.pzhand .card.rvbetter{outline:3px solid var(--good);outline-offset:-1px;}
.pzres{margin:.7rem 0;padding:.7rem .8rem;border-radius:14px;background:#fff;border:2px solid var(--gold);}
.pzres.s3{border-color:var(--good);}
.pzstars{font-size:1.6rem;letter-spacing:.1em;margin-bottom:.2rem;}

/* four-color deck: diamonds blue, clubs green */
body.four .card.su-D{color:#1c5fb8;}
body.four .card.su-C{color:#23803a;}
/* game feel */
.slot.p0 .card.fly{--fx:0px;--fy:70px;} .slot.p2 .card.fly{--fx:0px;--fy:-70px;}
.slot.p1 .card.fly{--fx:70px;--fy:0px;} .slot.p3 .card.fly{--fx:-70px;--fy:0px;}
@keyframes fly{from{transform:translate(var(--fx,0px),var(--fy,16px)) scale(.9) rotate(-4deg);opacity:0;}70%{opacity:1;}to{transform:none;opacity:1;}}
.card.fly{animation:fly .34s cubic-bezier(.25,.8,.35,1);}
.felt.thump{animation:thump .42s ease-out;}
@keyframes thump{0%{transform:none;}20%{transform:translateY(3px) scale(.995);}45%{transform:translateY(-2px);}100%{transform:none;}}
.felt.shake{animation:shake .42s ease-in-out;}
@keyframes shake{0%,100%{transform:none;}20%{transform:translateX(-6px);}40%{transform:translateX(5px);}60%{transform:translateX(-3px);}80%{transform:translateX(2px);}}
.ptsfly{position:fixed;z-index:80;pointer-events:none;font-weight:900;font-size:1.15rem;color:#fff;background:var(--red);border-radius:99px;padding:.15rem .6rem;box-shadow:0 3px 10px rgba(0,0,0,.3);transform:translate(-50%,-50%);}
.ptsfly.mine{background:var(--good);}
@media (prefers-reduced-motion: reduce){ .card.fly,.felt.thump,.felt.shake{animation:none;} }

/* large text: the reading parts grow, the table keeps its layout */
body.bigtext #setup .wrap, body.bigtext .statusline, body.bigtext .logpanel, body.bigtext .overlay .box, body.bigtext .talkmenu, body.bigtext .toast{zoom:1.15;}
body.bigtext .felt .seatlbl{font-size:.86rem;}

/* ================= ENGINE (pure, no DOM) =================
   Sheng Ji / 80 points rules. Cards are referenced by id 0..107;
   CARDS[id] = {id, s:'S'|'H'|'C'|'D'|'J', r}. Normal ranks 2..14 (A=14),
   jokers: small r=15, big r=16. */
const SUITS = ["S", "H", "C", "D"];
const CARDS = (() => {
  const out = []; let id = 0;
  for (let d = 0; d < 2; d++){
    for (const s of SUITS) for (let r = 2; r <= 14; r++) out.push({ id:id++, s, r });
    out.push({ id:id++, s:"J", r:15 });
    out.push({ id:id++, s:"J", r:16 });
  }
  return out;
})();
const cardPts = (c) => c.r === 5 ? 5 : (c.r === 10 || c.r === 13) ? 10 : 0;
const sumPts = (cards) => cards.reduce((a, c) => a + cardPts(c), 0);
const keyOf = (c) => c.s + c.r;
function isTrump(c, ctx){ return c.s === "J" || c.r === ctx.level || (ctx.trump != null && c.s === ctx.trump); }
function effSuit(c, ctx){ return isTrump(c, ctx) ? "T" : c.s; }
/* strength value inside a card's effective suit. consecutive integers mean
   "adjacent" for tractors. side suits and the trump suit's plain cards run
   0..11 (the level rank is skipped); then off-suit level cards 12 (all equal),
   trump-suit level card 13, small joker, big joker. no-trump closes the gap. */
function cardVal(c, ctx){
  if (c.s === "J"){
    if (ctx.trump == null) return c.r === 16 ? 14 : 13;
    return c.r === 16 ? 15 : 14;
  }
  if (c.r === ctx.level) return (ctx.trump != null && c.s === ctx.trump) ? 13 : 12;
  return c.r - 2 - (c.r > ctx.level ? 1 : 0);
}
function shuffleArr(a, rnd){ rnd = rnd || Math.random; for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------- structure of a group of cards (assumed one effective suit) ---------- */
function pairInfo(cards, ctx){
  // keys appearing twice -> pairs (with value); identical cards only
  const byKey = new Map();
  for (const c of cards){ const k = keyOf(c); if (!byKey.has(k)) byKey.set(k, []); byKey.get(k).push(c); }
  const pairs = [], singles = [];
  for (const [, arr] of byKey){
    if (arr.length >= 2){ pairs.push({ v:cardVal(arr[0], ctx), cards:[arr[0], arr[1]] }); for (let i = 2; i < arr.length; i++) singles.push(arr[i]); }
    else singles.push(arr[0]);
  }
  return { pairs, singles };
}
const pairCount = (cards, ctx) => pairInfo(cards, ctx).pairs.length;
/* longest run of consecutive pair values; returns {len, top} (len 0 if no pair) */
function runsOf(pairVals){
  const vals = [...new Set(pairVals)].sort((a, b) => a - b);
  const runs = []; let start = 0;
  for (let i = 1; i <= vals.length; i++){
    if (i === vals.length || vals[i] !== vals[i - 1] + 1){ runs.push({ len:i - start, top:vals[i - 1], bottom:vals[start] }); start = i; }
  }
  return runs;
}
function maxTractor(cards, ctx){
  const runs = runsOf(pairInfo(cards, ctx).pairs.map(p => p.v));
  return runs.reduce((m, r) => Math.max(m, r.len), 0);
}
/* decompose into tractors (greedy longest), loose pairs, singles */
function decompose(cards, ctx){
  const { pairs, singles } = pairInfo(cards, ctx);
  const byVal = new Map();
  for (const p of pairs){ if (!byVal.has(p.v)) byVal.set(p.v, []); byVal.get(p.v).push(p); }
  const tractors = [], loose = [];
  const pool = new Map([...byVal].map(([v, arr]) => [v, arr.slice()]));
  for (;;){
    const runs = runsOf([...pool.keys()].filter(v => pool.get(v).length)).filter(r => r.len >= 2).sort((a, b) => b.len - a.len || b.top - a.top);
    if (!runs.length) break;
    const r = runs[0]; const tc = [];
    for (let v = r.bottom; v <= r.top; v++){ const p = pool.get(v).shift(); tc.push(...p.cards); }
    tractors.push({ len:r.len, top:r.top, cards:tc });
  }
  for (const [, arr] of pool) for (const p of arr) loose.push(p);
  return { tractors, pairs:loose, singles:singles.map(c => ({ v:cardVal(c, ctx), cards:[c] })) };
}
/* classify a lead. returns null when cards span effective suits */
function classifyLead(cards, ctx){
  if (!cards.length) return null;
  const e = effSuit(cards[0], ctx);
  if (cards.some(c => effSuit(c, ctx) !== e)) return null;
  const d = decompose(cards, ctx);
  const pc = d.tractors.reduce((a, t) => a + t.len, 0) + d.pairs.length;
  let type;
  if (cards.length === 1) type = "single";
  else if (cards.length === 2 && d.pairs.length === 1) type = "pair";
  else if (d.tractors.length === 1 && !d.pairs.length && !d.singles.length) type = "tractor";
  else type = "throw";
  const mt = d.tractors.reduce((m, t) => Math.max(m, t.len), 0);
  return { type, eff:e, n:cards.length, pairs:pc, maxTr:mt, parts:d, cards };
}

/* ---------- throw validity: every part must be unbeatable by another
   player's ACTUAL holding in that effective suit (Bryan, Nov 10) ---------- */
function partBeatenBy(part, kind, hand, e, ctx){
  const hs = hand.filter(c => effSuit(c, ctx) === e);
  if (kind === "single") return hs.some(c => cardVal(c, ctx) > part.v);
  const pv = pairInfo(hs, ctx).pairs.map(p => p.v);
  if (kind === "pair") return pv.some(v => v > part.v);
  return runsOf(pv).some(r => r.len >= part.len && r.top > part.top);
}
function throwCheck(lead, otherHands, ctx){
  const d = lead.parts;
  const parts = [
    ...d.tractors.map(t => ({ kind:"tractor", part:t })),
    ...d.pairs.map(p => ({ kind:"pair", part:p })),
    ...d.singles.map(s => ({ kind:"single", part:s })),
  ];
  // every part someone can beat; a failed throw plays only the smallest of
  // them (Bryan, Nov 10: "force the smallest part"; Pagat: the beatable part
  // is led). smallest = lowest value, fewer cards first on a tie.
  const beaten = parts.filter(p => otherHands.some(h => partBeatenBy(p.part, p.kind, h, lead.eff, ctx)));
  if (!beaten.length) return { ok:true };
  const size = (p) => p.kind === "single" ? 1 : p.kind === "pair" ? 2 : 3;
  const top = (p) => p.kind === "tractor" ? p.part.top : p.part.v;
  beaten.sort((a, b) => top(a) - top(b) || size(a) - size(b));
  return { ok:false, kind:beaten[0].kind, cards:beaten[0].part.cards };
}
/* validate a lead: one effective suit; throws must pass the check */
function validateLead(cards, otherHands, ctx){
  const lead = classifyLead(cards, ctx);
  if (!lead) return { ok:false, why:"mixed" };
  if (lead.type === "throw"){
    const t = throwCheck(lead, otherHands, ctx);
    if (!t.ok) return { ok:false, why:"throw", fail:t };
  }
  return { ok:true, lead };
}

/* ---------- following ---------- */
function followReq(hand, lead, ctx){
  const hs = hand.filter(c => effSuit(c, ctx) === lead.eff);
  if (hs.length <= lead.n) return { all:true, hs };
  const reqPairs = Math.min(lead.pairs, pairCount(hs, ctx));
  let reqTr = lead.maxTr >= 2 ? Math.min(lead.maxTr, maxTractor(hs, ctx)) : 0;
  if (reqTr < 2) reqTr = 0;
  return { all:false, hs, reqPairs, reqTr };
}
/* returns "" when legal, else a reason code */
function followProblem(play, hand, lead, ctx){
  if (play.length !== lead.n) return "count";
  const ids = new Set(hand.map(c => c.id));
  if (play.some(c => !ids.has(c.id))) return "notInHand";
  if (new Set(play.map(c => c.id)).size !== play.length) return "dup";
  const req = followReq(hand, lead, ctx);
  const pids = new Set(play.map(c => c.id));
  if (req.all){ return req.hs.every(c => pids.has(c.id)) ? "" : "mustSuitAll"; }
  if (play.some(c => effSuit(c, ctx) !== lead.eff)) return "mustSuit";
  if (pairCount(play, ctx) < req.reqPairs) return "mustPairs";
  if (req.reqTr && maxTractor(play, ctx) < req.reqTr) return "mustTractor";
  return "";
}

/* ---------- trick resolution ---------- */
/* strength of a play relative to the lead; null = cannot win */
function playStrength(cards, lead, ctx, isLead){
  const e = effSuit(cards[0], ctx);
  if (cards.some(c => effSuit(c, ctx) !== e)) return null;
  if (e !== lead.eff && e !== "T") return null;
  if (!isLead){
    if (lead.type === "throw" && e === lead.eff) return null; // a valid throw is boss in its suit
    if (pairCount(cards, ctx) < lead.pairs) return null;
    if (lead.maxTr >= 2 && maxTractor(cards, ctx) < lead.maxTr) return null;
  }
  // primary component value (by the lead's shape)
  let v;
  const info = pairInfo(cards, ctx);
  if (lead.maxTr >= 2){
    v = Math.max(...runsOf(info.pairs.map(p => p.v)).filter(r => r.len >= lead.maxTr).map(r => r.top));
  } else if (lead.pairs > 0){
    v = Math.max(...info.pairs.map(p => p.v));
  } else v = Math.max(...cards.map(c => cardVal(c, ctx)));
  return { t:e === "T", v };
}
const beats = (a, b) => !!a && (!b || (a.t && !b.t) || (a.t === b.t && a.v > b.v));
/* plays: [{seat, cards}] in play order; returns index of winning play */
function trickWinner(plays, ctx){
  const lead = classifyLead(plays[0].cards, ctx);
  let best = 0, bs = playStrength(plays[0].cards, lead, ctx, true);
  for (let i = 1; i < plays.length; i++){
    const s = playStrength(plays[i].cards, lead, ctx, false);
    if (beats(s, bs)){ best = i; bs = s; }
  }
  return best;
}
/* bottom multiplier = 2^(pairs in the winning combination); a follower can
   only win by matching the lead's shape, so the lead's pair count is used */
function bottomMultiplier(leadCards, ctx){ return Math.pow(2, classifyLead(leadCards, ctx).pairs); }
/* level change table (Section 3.6), extended by Bryan: every 40 points past 80 is another level */
function levelResult(oppPts){
  if (oppPts <= 0) return { side:"decl", d:3 };
  if (oppPts < 40) return { side:"decl", d:2 };
  if (oppPts < 80) return { side:"decl", d:1 };
  return { side:"opp", d:Math.floor((oppPts - 80) / 40) }; // 80–115: defenders just take over hosting; +1 per 40 above that (Bryan, Nov 10)
}
/* anti options, strictly stronger than `cur` (0 = plain reveal, 1 = level
   pair, 2 = small-joker pair, 3 = big-joker pair) */
function antiOptions(hand, level, trump, cur, round1){
  const opts = []; const cnt = new Map();
  for (const c of hand){ const k = keyOf(c); cnt.set(k, (cnt.get(k) || 0) + 1); }
  if (cur < 1) for (const s of SUITS) if (s !== trump && (cnt.get(s + level) || 0) >= 2) opts.push({ str:1, kind:"level", suit:s });
  if (cur < 2 && (cnt.get("J15") || 0) >= 2) opts.push({ str:2, kind:"sj" });
  // Bryan, Nov 21: after round 1 a big-joker pair may not overtrump a small-joker pair (cur 2) — only in round 1 can it win the bottom
  if (cur < 3 && (cur < 2 || round1) && (cnt.get("J16") || 0) >= 2) opts.push({ str:3, kind:"bj" });
  return opts;
}
/* reinforce (Bryan, Nov 21): whoever called trump with one level card can show the
   second copy, making the call a pair. then only a joker pair can overtrump it. */
function reinforceOption(hand, level, trump, cur, trumpCards){
  if (!trump || cur >= 1 || !trumpCards || trumpCards.length !== 1) return null;
  const n = hand.filter(c => c.s === trump && c.r === level).length;
  return n >= 2 ? { str:1, kind:"reinforce", suit:trump } : null;
}
const levelSuitsHeld = (hand, level) => [...new Set(hand.filter(c => c.s !== "J" && c.r === level).map(c => c.s))];
/* hand sort for display: trumps first (high to low), then side suits ♠♥♣♦ high to low */
/* hand order (Bryan, Nov 10): trump at the far left, then the side suits
   with colours alternating so neighbouring suits never look alike. the side
   suits are arranged to minimise same-colour neighbours, counting the trump
   suit's colour as the left anchor. */
const isRedSuit = (s) => s === "H" || s === "D";
function permsOf(a){ if (a.length <= 1) return [a.slice()]; const out = []; a.forEach((x, i) => { for (const p of permsOf(a.filter((_, j) => j !== i))) out.push([x, ...p]); }); return out; }
function suitOrder(hand, ctx, all){
  const present = SUITS.filter(s => s !== ctx.trump && (all || hand.some(c => effSuit(c, ctx) === s)));
  const hasT = all || hand.some(c => isTrump(c, ctx));
  const anchor = hasT && ctx.trump ? isRedSuit(ctx.trump) : null;
  let best = present, bestCost = 1e9;
  for (const perm of permsOf(present)){
    let cost = 0, prev = anchor;
    for (const x of perm){ const col = isRedSuit(x); if (prev === col) cost++; prev = col; }
    if (cost < bestCost){ bestCost = cost; best = perm; }
  }
  return hasT ? ["T", ...best] : best;
}
function sortHand(hand, ctx){
  const ord = {}; suitOrder(hand, ctx).forEach((e, i) => ord[e] = i);
  // inside the trump group, off-suit level cards alternate colours too
  const tie = {}; [ctx.trump, ...suitOrder(hand, ctx, true).filter(x => x !== "T"), "J"].forEach((x, i) => { if (x) tie[x] = i; });
  return hand.slice().sort((a, b) => {
    const ea = effSuit(a, ctx), eb = effSuit(b, ctx);
    if (ea !== eb) return ord[ea] - ord[eb];
    const va = cardVal(a, ctx), vb = cardVal(b, ctx);
    if (va !== vb) return vb - va;
    if (a.s !== b.s) return tie[a.s] - tie[b.s];
    return a.id - b.id;
  });
}

/* ================= COMPUTER PLAYERS (pure) =================
   AIs see only: their own hand, every card played so far, the current
   trick, the reveal/antis, who has shown out of which suit, and (trump host
   only) the cards they buried. They never look at other hands.

   Difficulty ladder (Bryan, Nov 10):
     easy   = the old medium player: sensible but simple, no card counting.
     medium = the old hard player plus table manners: play low when the other
              team is winning, feed points when your partner has the trick,
              second seat plays low, trump in only when it pays.
     hard   = card counting with a fuzzy memory (important cards are almost
              always remembered, small ones fade), tracks who is out of what,
              counts trump, leads into partner's voids, avoids suits an
              opponent can trump, only takes tricks it can keep, and buries
              to make voids. */
const AI = (() => {
  const X = typeof AIX !== "undefined" ? AIX : {};   // experiment switches (benchmarks only)
  const rnd = () => Math.random();
  const pick = (a) => a[Math.floor(rnd() * a.length)];
  const tier = (d) => d === "hard" || d === "hardX" || d === "veryhard" ? 3 : d === "medium" || d === "mediumX" ? 2 : 1;   // mediumX: benchmark-only variant
  const byVal = (ctx) => (a, b) => cardVal(a, ctx) - cardVal(b, ctx);
  const suitLen = (hand, s, level) => hand.filter(c => c.s === s && c.r !== level).length;
  const highCount = (hand, s, level) => hand.filter(c => c.s === s && c.r !== level && c.r >= 13).length;
  let WHY = null;                       // reason for the last lead/follow (shown on "suggest")
  const why = (k) => { WHY = k; };

  /* ---------- declaring ---------- */
  // how good `s` would be as trump: every trump it would give me, high ones and pairs extra
  function trumpScore(hand, s, level){
    const ctx = { level, trump:s };
    const tr = hand.filter(c => isTrump(c, ctx));
    return tr.length + 0.6 * tr.filter(c => c.s === "J" || c.r === level || c.r >= 13).length + 0.5 * pairCount(tr, ctx);
  }
  function bestLevelSuit(hand, level, T){
    const suits = levelSuitsHeld(hand, level);
    if (!suits.length) return null;
    return suits.map(s => ({ s, len:suitLen(hand, s, level), score:T >= 3 ? trumpScore(hand, s, level) : suitLen(hand, s, level) + 0.6 * highCount(hand, s, level) }))
      .sort((a, b) => b.score - a.score)[0];
  }
  // called during the deal after each of this player's cards arrives
  function revealDuringDeal(diff, hand, level){
    let T = tier(diff); if (T === 3 && X.rev2) T = 2;
    const b = bestLevelSuit(hand, level, T); if (!b) return null;
    const n = hand.length;
    if (T === 1) return (n >= 9 && b.len >= Math.ceil(n * 0.3)) || (n >= 20 && b.len >= 5) ? b.s : null;
    if (T === 2) return (n >= 12 && b.score >= n * 0.34) || (n >= 22 && b.len >= 6) ? b.s : null;
    return (n >= 10 && b.score >= n * 0.5) || (n >= 21 && b.score >= 10.5) ? b.s : null;
  }
  // last call, after the deal
  function revealAtEnd(diff, hand, level){
    let T = tier(diff); if (T === 3 && X.rev2) T = 2;
    const b = bestLevelSuit(hand, level, T); if (!b) return null;
    if (T === 1) return b.len >= 5 ? b.s : null;
    if (T === 2) return b.score >= 6.5 ? b.s : null;
    return b.score >= 10 ? b.s : null;
  }
  // overtrump decision; partnerCalled = the standing call is my partner's
  function anti(diff, hand, opts, ctx, partnerCalled){
    if (!opts.length) return null;
    let T = tier(diff); if (T === 3 && X.anti2) T = 2;
    const curLen = ctx.trump ? suitLen(hand, ctx.trump, ctx.level) : 0;
    if (T === 3){
      const cur = ctx.trump ? trumpScore(hand, ctx.trump, ctx.level) : ntScore(hand, ctx.level);
      const scored = opts.map(o => ({ o, sc:o.kind === "level" ? trumpScore(hand, o.suit, ctx.level) : ntScore(hand, ctx.level) })).sort((a, b) => b.sc - a.sc);
      const best = scored[0];
      if (partnerCalled) return best.sc >= cur + 5 ? best.o : null;
      if (best.sc >= cur + 2 && best.sc >= 7) return best.o;
      // spoil a strong opposing suit with jokers when that suit is useless to me
      const jk = scored.find(x => x.o.kind !== "level");
      if (jk && ctx.trump && cur <= 4.5 && jk.sc >= 4) return jk.o;
      return null;
    }
    if (partnerCalled){
      const lv0 = opts.filter(o => o.kind === "level").map(o => ({ o, len:suitLen(hand, o.suit, ctx.level) })).sort((a, b) => b.len - a.len)[0];
      return lv0 && lv0.len >= curLen + 4 ? lv0.o : null;
    }
    const joker = opts.filter(o => o.kind !== "level").sort((a, b) => b.str - a.str)[0];
    const lv = opts.filter(o => o.kind === "level").map(o => ({ o, len:suitLen(hand, o.suit, ctx.level) })).sort((a, b) => b.len - a.len)[0];
    if (T === 1){
      if (lv && lv.len >= curLen + 3) return lv.o;
      if (joker && ctx.trump && curLen <= 3) return joker;
      return null;
    }
    if (lv && lv.len >= curLen + 2 && lv.len >= 5) return lv.o;
    if (joker && ctx.trump && curLen <= 3) return joker;
    return null;
  }
  function ntScore(hand, level){
    const ctx = { level, trump:null };
    const tr = hand.filter(c => isTrump(c, ctx));
    return tr.length * 1.4 + 0.5 * hand.filter(c => c.s !== "J" && c.r === 14).length;
  }
  // forced call: pick the longest / strongest of the allowed suits
  function forcedCall(diff, hand, suits, level){
    const T = tier(diff);
    const sc = (s) => T >= 3 ? trumpScore(hand, s, level) : suitLen(hand, s, level) + 0.6 * highCount(hand, s, level);
    return suits.slice().sort((a, b) => sc(b) - sc(a))[0];
  }

  /* ---------- bury 8 ---------- */
  function bury(diff, hand, ctx){
    let T = tier(diff); if (T === 3 && X.bury2) T = 2;
    const out = new Set();
    const take = (cards) => { for (const c of cards){ if (out.size >= 8) break; out.add(c.id); } };
    const nonPointSide = hand.filter(c => !isTrump(c, ctx) && !cardPts(c));
    const pairKeys = new Set(pairInfo(hand, ctx).pairs.map(p => keyOf(p.cards[0])));
    const singlesFirst = (a, b) => (pairKeys.has(keyOf(a)) - pairKeys.has(keyOf(b))) || cardVal(a, ctx) - cardVal(b, ctx);
    const sideGroups = SUITS.filter(s => s !== ctx.trump).map(s => ({ s, cards:hand.filter(c => effSuit(c, ctx) === s) })).filter(x => x.cards.length);
    // no-trump with few trumps (jokers + level cards): a void can't be ruffed, so don't strip suits for it
    const canRuff = ctx.trump != null || hand.filter(c => isTrump(c, ctx)).length >= 4;
    if (T === 3){
      // make voids: whole short suits with no ace, no pairs (fewest cards first) — points allowed (Bryan, Nov 21): bury a point card to complete a void
      const voidable = !canRuff ? [] : sideGroups.filter(x => !x.cards.some(c => c.r === 14 || pairKeys.has(keyOf(c)))).sort((a, b) => a.cards.length - b.cards.length);
      for (const x of voidable) if (x.cards.length <= 8 - out.size) take(x.cards);
      // then low singles from the shortest suits that have no ace (long suits stay whole)
      const shortFirst = sideGroups.slice().sort((a, b) => a.cards.length - b.cards.length);
      for (const x of shortFirst) if (!x.cards.some(c => c.r === 14)) take(x.cards.filter(c => !cardPts(c) && !pairKeys.has(keyOf(c))).sort(byVal(ctx)));
      take(nonPointSide.filter(c => c.r !== 14 && !pairKeys.has(keyOf(c))).sort(byVal(ctx)));
      take(nonPointSide.slice().sort(singlesFirst));
    } else if (T === 2){
      // try to void a short side suit (no aces, no points, no pairs)
      const suits = !canRuff ? [] : sideGroups.filter(x => x.cards.length <= 8 - out.size && !x.cards.some(c => cardPts(c) || c.r === 14 || pairKeys.has(keyOf(c))))
        .sort((a, b) => a.cards.length - b.cards.length);
      for (const x of suits) if (x.cards.length <= 8 - out.size) take(x.cards);
      take(nonPointSide.filter(c => c.r !== 14).sort(singlesFirst));
      take(nonPointSide.slice().sort(singlesFirst));
    } else {
      take(nonPointSide.filter(c => c.r !== 14).sort(singlesFirst));
      take(nonPointSide.slice().sort(singlesFirst));
    }
    // forced: non-point trumps, then point cards (lowest first)
    take(hand.filter(c => isTrump(c, ctx) && !cardPts(c)).sort(byVal(ctx)));
    take(hand.filter(c => cardPts(c)).sort((a, b) => cardPts(a) - cardPts(b) || cardVal(a, ctx) - cardVal(b, ctx)));
    return hand.filter(c => out.has(c.id));
  }

  /* ---------- knowledge ---------- */
  // unseen = cards this player cannot account for (not in hand, not played, not buried by them)
  function unseen(st){
    const known = new Set([...st.hand.map(c => c.id), ...st.playedIds, ...(st.buried || []).map(c => c.id)]);
    for (const p of st.trick) for (const c of p.cards) known.add(c.id);
    return CARDS.filter(c => !known.has(c.id));
  }
  /* fuzzy memory (hard): each played card is remembered with a probability
     that depends on how much it matters and how long ago it fell. the coin
     is fixed per player, card and round, so a forgotten card stays forgotten
     (no flickering between decisions). forgotten cards count as still out. */
  function coin(seat, id, round){
    let h = 2166136261 ^ (seat * 977 + 13);
    for (const x of [id, round, seat]){ h ^= x; h = Math.imul(h, 16777619); h ^= h >>> 13; }
    return ((h >>> 0) % 10007) / 10007;
  }
  function recallP(c, ctx, age){
    const big = isTrump(c, ctx) || c.r >= 13 || cardPts(c) > 0;
    return Math.max(0.45, big ? 0.985 - 0.004 * age : 0.88 - 0.02 * age);
  }
  function fuzzyUnseen(st){
    if (st.perfect) return unseen(st);   // suggestions for a person: they've seen every card played
    const known = new Set([...st.hand.map(c => c.id), ...(st.buried || []).map(c => c.id)]);

/* ================= ROUND / MATCH FLOW (shared by UI and simulator) =================

function newMatch(players, rnd, startLevel){

    antiCur = o.str;
    R.trump = o.kind === "level" ? o.suit : null;
    R.caller = seat;
    R.antis.push({ seat, ...o });
    const pr = R.hands[seat].filter(c => o.kind === "level" ? c.s === o.suit && c.r === R.level : c.s === "J" && c.r === (o.kind === "sj" ? 15 : 16)).slice(0, 2);

        fresh.forEach(x => R._seen.add(x));

      for (let k = 0; k < 4 && R.caller == null; k++){
        const s2 = (dealStart + k) % 4;
        if (!io.humanSeat(s2)) continue;
        const pick = await io.ask(s2, "dealCheck", { suits:levelSuitsHeld(R.hands[s2], level), level, chunk:(i + 1) / 20 });
        if (pick && canDeclare(s2, pick)) doDeclare(s2, pick);
      }
    }
    if (R.caller == null){
      const hr = io.liveDeal ? io.dealReveal() : null;
      if (hr && canDeclare(hr.seat, hr.suit)) doDeclare(hr.seat, hr.suit);
      else if (!io.humanSeat(seat)){

  for (let k = 0; k < 4 && R.caller == null; k++){
    const seat = (dealStart + k) % 4;
    const suits = levelSuitsHeld(R.hands[seat], level);
    if (!suits.length) continue;
    let s = null;
    if (io.humanSeat(seat)){ if (io.liveDeal) s = await io.ask(seat, "reveal", { suits, level }); }

      // first level card turned sets trump; else the highest card (jokers
      // ignored), ties going to the first one turned.
      const flipped = [];
      let suit = null, best = null;

        flipped.push(c);
        io.ev("flip", { card:c, flipped:flipped.slice() });
        await io.delay("think");
        if (c.s !== "J" && c.r === level){ suit = c.s; break; }
        if (c.s !== "J" && (!best || c.r > best.r)) best = c;
      }
      if (!suit) suit = best ? best.s : SUITS[0];
      R.forced = { seat:keeper, flip:true, flipped:flipped.map(c => c.id), keeper };
      R.forced.decider = (flipped.find(c => c.s === suit && c.r === level) || best || flipped[flipped.length - 1]).id;
      doDeclare(keeper, suit, R.forced);

    const ro = reinforceOption(R.hands[R.caller], R.level, R.trump, antiCur, R.trumpCards);
    if (ro){
      if (io.humanSeat(R.caller)){ if (io.liveDeal){ const ch = await io.ask(R.caller, "anti", { opts:[ro], ctx:ctx(), caller:R.caller, reinforce:true }); if (ch) reinforce(R.caller); } }
      else reinforce(R.caller);
    }
  }
  {
    let cur = antiCur, passes = 0, seat = R.caller, guard = 0;
    while (passes < 3 && guard++ < 80){
      seat = (seat + 1) % 4;
      if (seat === R.caller) continue;
      const opts = antiOptions(R.hands[seat], R.level, R.trump, cur, R.round === 1);
      let choice = null;
      if (io.humanSeat(seat)){ if (opts.length) choice = await io.ask(seat, "anti", { opts, ctx:ctx(), caller:R.caller }); }
      else { if (opts.length) choice = AI.anti(M.players[seat].diff, R.hands[seat], opts, ctx(), R.caller % 2 === seat % 2); await io.delay("think"); }
      if (choice){
        cur = choice.str; passes = 0;
        R.trump = choice.kind === "level" ? choice.suit : null;
        R.caller = seat;
        R.antis.push({ seat, ...choice });
        const pr = R.hands[seat].filter(c => choice.kind === "level" ? c.s === choice.suit && c.r === R.level : c.s === "J" && c.r === (choice.kind === "sj" ? 15 : 16)).slice(0, 2);
        R.trumpCards = pr.map(c => c.id);
        io.ev("anti", { seat, choice });
      } else passes++;
    }
  }
  // round 1: the call that stands keeps the bottom (unless the first drawer was forced to call)
  if (R.declarer == null) R.declarer = R.caller;
  R.declTeam = R.declarer % 2;
  io.ev("phase", { p:null });
  io.ev("trumpSet", { R });
  io.ev("keeper", { seat:R.declarer });
  /* ---- bottom ---- */
  const d = R.declarer;
  R.hands[d].push(...R.bottom);
  io.ev("bottomTaken", { seat:d });
  let buried;
  if (io.humanSeat(d)) buried = await io.ask(d, "bury", { hand:R.hands[d], ctx:ctx() });
  else { buried = AI.bury(M.players[d].diff, R.hands[d], ctx()); await io.delay("think"); }
  const bids = new Set(buried.map(c => c.id));
  if (bids.size !== 8) throw new Error("bury must be 8 cards");
  R.buried = R.hands[d].filter(c => bids.has(c.id));
  R.hands[d] = R.hands[d].filter(c => !bids.has(c.id));
  io.ev("buried", { seat:d });
  R.leader = d;
  return playTricks(M, R, io);
}
/* ---- tricks until every hand is empty (25 only when every lead is a single),
   then scoring. also the entry point when a saved round is resumed. ---- */
async function playTricks(M, R, io){
  const ctx = () => ({ level:R.level, trump:R.trump });
  const d = R.declarer;
  for (let t = R.tricks.length; R.hands[R.leader].length > 0; t++){
    R.trick = [];
    // review log (Nov 21): enough to replay every decision afterwards
    R.playLog = R.playLog || [];

    R.playLog.push(logT);
    io.ev("trickStart", { t, leader:R.leader });
    for (let k = 0; k < 4; k++){
      const seat = (R.leader + k) % 4;
      const st = aiState(R, seat);
      let cards;
      if (k === 0){
        if (io.humanSeat(seat)) cards = await io.ask(seat, "lead", { st });
        else {
          cards = AI.lead(M.players[seat].diff, st);
          await io.delay("play");   // a failed computer throw is handled below like anyone's
        }
        let v = validateLead(cards, otherHands(R, seat), ctx());
        if (!v.ok && v.why === "throw"){
          // failed throw: the attempt is shown, and only the smallest beatable part is led
          const attempted = cards;
          logT.attempted = attempted.map(c => c.id);
          cards = v.fail.cards;
          io.ev("throwFail", { seat, attempted, forced:cards, kind:v.fail.kind });
          v = validateLead(cards, otherHands(R, seat), ctx());
        }
        if (!v.ok) throw new Error("illegal lead reached the table");
      } else {
        const lead = classifyLead(R.trick[0].cards, ctx());
        if (io.humanSeat(seat)) cards = await io.ask(seat, "follow", { st, lead });
        else { cards = AI.follow(M.players[seat].diff, st); await io.delay("play"); }
        const prob = followProblem(cards, R.hands[seat], lead, ctx());
        if (prob) throw new Error("illegal follow (" + prob + ") by seat " + seat);
        if (cards.filter(c => effSuit(c, ctx()) === lead.eff).length < lead.n) R.voids[seat].add(lead.eff);
      }
      const ids = new Set(cards.map(c => c.id));
      R.hands[seat] = R.hands[seat].filter(c => !ids.has(c.id));
      R.trick.push({ seat, cards });
      logT.plays.push({ seat, ids:cards.map(c => c.id) });
      io.ev("play", { seat, cards, k });
    }
    const wi = trickWinner(R.trick, ctx());
    const win = R.trick[wi].seat;
    const pts = R.trick.reduce((a, p) => a + sumPts(p.cards), 0);
    for (const p of R.trick) for (const c of p.cards) R.playedIds.push(c.id);
    R.tricks.push({ plays:R.trick, winner:win, pts });
    logT.winner = win; logT.pts = pts;
    if (win % 2 !== R.declTeam) R.oppPts += pts;
    io.ev("trickEnd", { t, winner:win, pts, R });
    await io.delay("trickEnd");
    R.leader = win;
  }

  const last = R.tricks[R.tricks.length - 1];
  const bottomPts = sumPts(R.buried);
  let bottomAward = 0, mult = 1;
  if (last.winner % 2 !== R.declTeam){
    mult = bottomMultiplier(last.plays[0].cards, ctx());
    bottomAward = bottomPts * mult;

  }

  const upTeam = res.side === "decl" ? R.declTeam : 1 - R.declTeam;
  const before = M.levels[upTeam];
  const after = before + res.d;
  const summary = { round:M.round, declarer:d, caller:R.caller, forced:R.forced, declTeam:R.declTeam, level:R.level, trump:R.trump,
    oppPts:R.oppPts, bottomPts, mult, bottomAward, lastWinner:last.winner, upTeam, d:res.d, before, after };

  // by the team that keeps the bottom at A and wins that round
  if (upTeam === R.declTeam && R.level === 14){ M.levels[upTeam] = 14; M.winner = upTeam; summary.won = true; }

  M.declTeam = upTeam;
  M.keeper = upTeam === R.declTeam ? (d + 2) % 4 : (d + 1) % 4;
  M.dealStart = M.keeper;
  M.round++;
  io.ev("roundEnd", { summary, R, M });
  return summary;
}
/* mid-round resume: the round is saved at the start of every trick */
function snapshotRound(R){

    playLog:R.playLog ? JSON.parse(JSON.stringify(R.playLog)) : [],
    hands:R.hands.map(ids), dealt:R.dealt ? R.dealt.map(a => a.slice()) : null, bottom:ids(R.bottom), buried:ids(R.buried), playedIds:R.playedIds.slice(),
    tricks:R.tricks.map(tr => ({ plays:tr.plays.map(p => ({ seat:p.seat, ids:ids(p.cards) })), winner:tr.winner, pts:tr.pts })),
    oppPts:R.oppPts, antis:R.antis, reveal:R.reveal, forced:R.forced, trumpCards:R.trumpCards || [],
    voids:R.voids.map(v => [...v]), leader:R.leader, dealStart:R.dealStart };

function restoreRound(o){
  const cs = (a) => a.map(id => CARDS[id]);

    tricks:o.tricks.map(tr => ({ plays:tr.plays.map(p => ({ seat:p.seat, cards:cs(p.ids) })), winner:tr.winner, pts:tr.pts })),
    oppPts:o.oppPts, antis:o.antis || [], reveal:o.reveal, forced:o.forced, trumpCards:o.trumpCards || [],
    voids:o.voids.map(v => new Set(v)), trick:[], leader:o.leader, dealStart:o.dealStart };

async function resumeRound(M, snap, io){
  const R = restoreRound(snap);

function otherHands(R, seat){ return [0, 1, 2, 3].filter(s => s !== seat).map(s => R.hands[s]); }

function aiState(R, seat){
  return {

    trick:R.trick.slice(), playedIds:R.playedIds.slice(),
    buried:seat === R.declarer ? R.buried : null,
    declarer:R.declarer, declTeam:R.declTeam, voids:R.voids,
    round:R.round, tricks:R.tricks, trumpCards:R.trumpCards || [], caller:R.caller,

/* ================= ROUND REVIEW (Nov 21) =================
   after each round every play is replayed and scored two ways:
     at the time: the cards that player couldn't see are dealt out many
       ways and every sensible option is played forward to the end of the
       trick (the same method the computers use), giving each option an
       expected value and a chance of winning the trick;
     in hindsight: the same options against everyone's real cards.
   from those scores come the round's 3 most relevant awards (each tied to a
   trick), a play-by-play, and coaching notes for each person's own plays.

  return {
    liveDeal:!ppMode(),
    dealPauses:!ppMode() && !G.online,   // online: no pauses (everyone shares one deal); slow deal speed gives time
    ev:(type, d) => { if (run === G.run) onEvent(type, d); },
    delay:(kind) => pacedDelay(kind, run),
    humanSeat:(seat) => G.M.players[seat].type === "human",
    dealReveal:() => G.dealFlags.shift() || null,
    dealAnti:() => G.dealAntis.shift() || null,
    ask:(seat, kind, data) => G.M.players[seat].remote != null ? remoteAsk(seat, kind, data, run) : askHuman(seat, kind, data, run),
  };
}
async function askHuman(seat, kind, data, run){
  if (run !== G.run) throw CANCEL;
  G.skip = false;
  if (ppMode() && G.viewer !== seat){
    await passTo(seat, run);
  }
  G.viewer = seat; G.handShown = true;
  G.sel = new Set(); G.msg = ""; G.msgWarn = false;
  return new Promise((resolve, reject) => {
    G.asking = { seat, kind, data, resolve:(v) => { G.asking = null; G.sel = new Set(); if (ppMode()) G.handShown = false; G.msg = ""; renderAll(); resolve(v); }, reject, run };
    if (kind === "follow"){
      const req = followReq(R().hands[seat], data.lead, ctxNow());
      if (req.all) for (const c of req.hs) G.sel.add(c.id);   // must play these anyway
    }
    renderAll();
  });
}
function passTo(seat, run){

    G.passWait = { resolve, reject, run };
    $("passLead").textContent = t("passTo"); $("passSub").textContent = t("hidden"); $("passBtn").textContent = t("thatsMe");
    $("passName").textContent = nameOf(seat);

/* ---------- events from the flow ---------- */
function onEvent(type, d){
  const r = R();
  netDirty();   // online: every engine event (each dealt card too) reaches the guests
  switch (type){
    case "roundStart":
      G.lastTrick = null; G.dealing = true; G.feltMsg = ""; G.roundOver = false; G.skip = false; G.endInfo = null; G.dealFlags = []; G.dealAntis = []; G.phase = null; // a ⏩ tap in the last round must not fast-forward the next round's deal (Buttguy, Nov 11)
      logMsg("lgRound", { r:G.M.round, l:tokLvl(r.level), who:G.M.declTeam == null ? "" : tokKey("lgRoundWho", { t:tokTeam(G.M.declTeam) }) });
      renderAll(); break;
    case "deal": if (!G.skip) renderFelt(); break;
    case "dealt": G.skip = false; G.dealing = false; renderAll(); break;
    case "reveal": {
      const c = r.hands[d.seat].find(x => x.s === d.suit && x.r === r.level);
      if (d.forced && d.forced.flip) logMsg("lgFlip", { n:tokName(d.seat), c:{ t:"cards", ids:d.forced.flipped }, s:tokSuit(d.suit) });
      else if (d.forced && d.forced.free) logMsg("lgForcedFree", { n:tokName(d.seat), s:tokSuit(d.suit) });
      else logMsg(d.forced ? "lgForced" : "lgReveal", { n:tokName(d.seat), c:tokCard(c), s:tokSuit(d.suit) });
      sndReveal(); G.feltMsg = nameOf(d.seat) + " · " + (c ? cardText(c) : SUIT_SYM[d.suit]); renderAll();
      announceTrump(d.seat, d.forced && d.forced.flip ? "flip" : "declare", d.suit, r.trumpCards); break;
    }
    case "flip": G.feltMsg = t("flipping") + " " + d.flipped.map(cardText).join(" "); renderAll(); break;
    case "throwFail": {
      logMsg("lgThrowFail", { n:tokName(d.seat), a:{ t:"cards", ids:d.attempted.map(c => c.id) }, c:{ t:"cards", ids:d.forced.map(c => c.id) } });
      G.feltMsg = t("throwFailShort", { n:nameOf(d.seat), c:d.forced.map(cardText).join(" ") }); sndBad(); renderAll(); feltShake("shake"); cpuTalkThrowFail(d.seat); break;
    }
    case "keeper": logMsg("lgKeeper", { n:tokName(d.seat) }); renderAll(); break;
    case "anti": {
      const ch = d.choice;
      const w = ch.kind === "level" ? tokKey("antiPairW", { c:LEVEL_NAMES[r.level] + SUIT_SYM[ch.suit] }) : tokKey(ch.kind === "sj" ? "sjPair" : "bjPair");
      logMsg("lgAnti", { n:tokName(d.seat), w, s:tokSuit(ch.kind === "level" ? ch.suit : null) }); sndReveal(); renderAll();
      announceTrump(d.seat, "anti", ch.kind === "level" ? ch.suit : null, r.trumpCards); break;
    }
    case "reinforce": {
      logMsg("lgReinforce", { n:tokName(d.seat), c:{ t:"cards", ids:r.trumpCards } });
      sndReveal(); renderAll(); announceTrump(d.seat, "reinforce", r.trump, r.trumpCards); break;
    }
    case "phase": G.phase = d.p; renderAll(); break;
    case "trumpSet": G.feltMsg = ""; renderAll(); break;
    case "bottomTaken": renderAll(); break;
    case "buried": logMsg("lgBury", { n:tokName(d.seat) }); renderAll(); break;
    case "trickStart":
      G.skip = false; G.feltMsg = ""; saveMatch(snapshotRound(r)); renderAll(); break;
    case "resumed":
      G.dealing = false; G.roundOver = false; G.feltMsg = "";
      G.lastTrick = r.tricks.length ? r.tricks[r.tricks.length - 1] : null;
      renderAll(); break;
    case "play": {
      G.flyIds = new Set(d.cards.map(c => c.id));
      sndCard(); renderAll(); if (!G.skip) feelPlay(d.seat, d.cards, r.trick); break;
    }
    case "trickEnd": {
      const tr = r.tricks[r.tricks.length - 1];
      G.lastTrick = tr;
      const oppGain = d.winner % 2 !== r.declTeam && d.pts;
      // "killing the hand": a trump play takes a side-suit lead
      const lead0 = classifyLead(tr.plays[0].cards, ctxNow());
      const wp = tr.plays.find(p => p.seat === d.winner);
      const killed = lead0.eff !== "T" && wp !== tr.plays[0] && wp.cards.every(c => isTrump(c, ctxNow()));
      G.feltMsg = t(killed ? "kills" : "wins", { n:nameOf(d.winner) }) + (d.pts ? " · " + d.pts : "");
      logMsg(killed ? "lgKill" : "lgTrick", { n:tokName(d.winner), t:d.t + 1, p:oppGain ? tokKey("lgTrickPts", { p:d.pts }) : "" });
      if (d.winner % 2 === meSeat() % 2) sndWinTrick();
      renderAll(); feelPoints(d.winner, d.pts); cpuTalkTrick(r, d, killed); break;
    }
    case "roundEnd": break;
  }
}

function handVisible(){

function renderHand(){
  const box = $("hand"); box.innerHTML = "";
  const r = R(); if (!r) return;
  const seat = G.viewer;
  const ctx = ctxNow();
  // always sorted by suit with alternating colours, during the deal too, so
  // you can see which suit is building up (Bryan, Nov 10). before trump is set,
  // jokers and level cards group at the left. the newest card is marked.
  const arrived = dealtSoFar(r, seat);
  let hand = sortHand(arrived, ctx);
  const newest = (G.dealing || (G.guest && NET.dealPhase)) && arrived.length ? arrived[arrived.length - 1].id : -1;
  const cw = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--cw")) || 52;
  const W = box.clientWidth || 340;
  const visible = handVisible();
  const asking = G.asking && G.asking.seat === seat ? G.asking : null;
  // legality dimming while following
  let allowed = null;
  if (asking && asking.kind === "follow"){
    const req = followReq(r.hands[seat], asking.data.lead, ctx);
    if (!req.all) allowed = new Set(req.hs.map(c => c.id));
  }
  let hl = null;
  if (asking && asking.kind === "anti") hl = new Set(r.hands[seat].filter(c => c.s === "J" || c.r === r.level).map(c => c.id));
  if (asking && ["reveal", "dealCheck", "forceCall"].includes(asking.kind)) hl = new Set(r.hands[seat].filter(c => c.s !== "J" && c.r === r.level).map(c => c.id));
  const n = hand.length; if (!n) return;
  if (asking && asking.kind === "bury" && visible){ renderBury(box, r.hands[seat], ctx, cw, W); return; }
  const oneRowStep = n > 1 ? (W - cw) / (n - 1) : cw;
  const rows = oneRowStep >= cw * 0.46 || n <= 8 ? [hand] : [hand.slice(0, Math.ceil(n / 2)), hand.slice(Math.ceil(n / 2))];
  rows.forEach((rowCards, ri) => {
    const row = document.createElement("div"); row.className = "handrow"; row.style.zIndex = ri + 1;   // lower rows sit on top, so every rank corner shows
    const m = rowCards.length;
    const step = m > 1 ? Math.min(cw + 4, (W - cw) / (m - 1)) : 0;
    const totalW = cw + step * (m - 1);
    const off = Math.max(0, (W - totalW) / 2);
    rowCards.forEach((c, i) => {
      let el;
      if (!visible) el = backEl();
      else el = cardEl(c, { onClick:asking ? onCardTap : null, cls:(G.sel.has(c.id) ? "sel" : "") + (allowed && !allowed.has(c.id) ? " dim" : "") + (hl && hl.has(c.id) ? " hl" : "") + (c.id === newest ? " new" : "") });
      el.style.left = (off + i * step) + "px";
      el.style.zIndex = i + 1;
      row.appendChild(el);
    });
    box.appendChild(row);
  });
}

/* the reason shown after "suggest", worked out from the actual play, so it
   always describes this hand (the AI's own key is only a hint) */
function explainPlay(key, cards, st){
  const ctx = st.ctx, hand = st.hand, partner = (st.seat + 2) % 4;
  const cardsTxt = cards.map(cardText).join(" ");
  const myPts = sumPts(cards);
  if (!st.trick.length){
    const lead = classifyLead(cards, ctx);
    const sName = suitName(lead.eff);
    const k = t(lead.type === "tractor" ? "kTractorW" : lead.type === "pair" ? "kPairW" : "kSingleW");
    if (key === "whyThrow" && lead.type === "throw") return t("whyThrow", { c:cardsTxt, s:sName });
    if (key === "whyBoss") return t("whyBoss", { c:cardsTxt, k, s:sName });
    if (key === "whyDrawTrump") return t("whyDrawTrump", { c:cardsTxt });
    if (key === "whyPartnerVoid") return t("whyPartnerVoid", { n:nameOf(partner), s:sName });
    if (key === "whyLowPair") return t("whyLowPair");
    if (key === "whyFishSmall") return t("whyFishSmall", { c:cardsTxt, n:nameOf(partner) });
    if (key === "whyFishPartner") return t("whyFishPartner", { c:cardsTxt, n:nameOf(partner) });
    if (key === "whyReturnSuit") return t("whyReturnSuit", { n:nameOf(partner), s:sName });
    if (key === "whyForce") return t("whyForce", { s:sName, n:nameOf(partner) });
    if (key === "whyVoid" && lead.eff !== "T"){
      const lens = {}; for (const c of hand){ const e = effSuit(c, ctx); if (e !== "T") lens[e] = (lens[e] || 0) + 1; }
      const shortest = Math.min(...Object.values(lens));
      if (lens[lead.eff] === shortest) return t("whyVoid", { s:sName });
    }
    if (hand.every(c => isTrump(c, ctx))) return t("whyOnlyTrump", { c:cardsTxt });
    return t("whyLowLead", { c:cardsTxt });
  }
  const lead = classifyLead(st.trick[0].cards, ctx);
  const plays = st.trick.map(p => ({ seat:p.seat, cards:p.cards }));
  const wi = trickWinner(plays, ctx), winSeat = plays[wi].seat;
  const bestStr = playStrength(plays[wi].cards, lead, ctx, wi === 0);
  const wins = beats(playStrength(cards, lead, ctx, false), bestStr);
  const trickPts = plays.reduce((a, p) => a + sumPts(p.cards), 0);
  const req = followReq(hand, lead, ctx);
  const sName = suitName(lead.eff);
  const partnerWinning = winSeat % 2 === st.seat % 2;
  // who still plays after me, and what they might do
  const after = [1, 2, 3].slice(0, 3 - st.trick.length).map(k => (st.seat + k) % 4);
  const oppsAfter = after.filter(p => p % 2 !== st.seat % 2);
  const uns = AI.unseen(st);
  const voidOpp = oppsAfter.find(p => st.voids && st.voids[p] && st.voids[p].has(lead.eff) && !st.voids[p].has("T"));
  const higherOut = (str) => str && uns.some(c => effSuit(c, ctx) === (str.t ? "T" : lead.eff) && cardVal(c, ctx) > str.v);
  if (wins){
    // nobody plays after me: partner already has it, so this only adds my points
    if (partnerWinning && !after.length) return myPts ? t("whyFeed", { n:nameOf(winSeat), p:myPts }) : t("whyPartnerLow", { n:nameOf(winSeat) });
    if (partnerWinning) return t("whyProtect", { n:nameOf(winSeat), p:trickPts + myPts });
    // a bigger winner than needed, because someone after me could beat the cheap one
    const cheapest = AI.followCandidates(hand, lead, ctx).filter(p => beats(playStrength(p, lead, ctx, false), bestStr)).sort((a, b) => a.reduce((x, c) => x + cardVal(c, ctx), 0) - b.reduce((x, c) => x + cardVal(c, ctx), 0))[0];
    if (oppsAfter.length && cheapest && cheapest.map(c => c.id).sort().join() !== cards.map(c => c.id).sort().join() && cards.reduce((x, c) => x + cardVal(c, ctx), 0) > cheapest.reduce((x, c) => x + cardVal(c, ctx), 0))
      return t("whySureWin", { c:cardsTxt, n:nameOf(oppsAfter[0]) });
    if (lead.eff !== "T" && cards.every(c => isTrump(c, ctx)) && !req.hs.length) return t("whyRuff", { s:sName, p:trickPts + myPts });
    return t("whyWin", { x:trickPts + myPts ? t("whyWinPts", { p:trickPts + myPts }) : "" });
  }
  if (partnerWinning){
    if (myPts && key === "whyFeed") return t("whyFeed", { n:nameOf(winSeat), p:myPts });
    if (key === "whyKeepPts" && hand.some(c => cardPts(c))) return t("whyKeepPts", { n:nameOf(winSeat) });
    return t("whyPartnerLow", { n:nameOf(winSeat) });
  }
  if (req.all && req.hs.length && req.hs.length < lead.n) return t("whyMust", { s:sName });
  if (req.all && !req.hs.length && !cards.some(c => isTrump(c, ctx))) return t("whyDiscard", { s:sName });
  const canWin = AI.followCandidates(hand, lead, ctx).some(p => beats(playStrength(p, lead, ctx, false), bestStr));
  if (!canWin){
    // a point card on a trick I can't win: only because my partner, still to play, might take it
    const cheaper = AI.followCandidates(hand, lead, ctx).some(p => sumPts(p) < myPts);
    if (myPts && cheaper && after.includes(partner) && higherOut(bestStr)) return t("whyRideAlong", { c:plays[wi].cards.map(cardText).join(" "), n:nameOf(partner), p:myPts });
    return t("whyCantWin", { c:plays[wi].cards.map(cardText).join(" ") });
  }
  if (key === "whySecondLow" && st.trick.length === 1) return t("whySecondLow", { n:nameOf(partner) });
  // I could take it now, but someone after me would take it back
  if (voidOpp != null) return t("whyLaterTrump", { n:nameOf(voidOpp), s:sName });
  const myBest = AI.followCandidates(hand, lead, ctx).map(p => playStrength(p, lead, ctx, false)).filter(x => beats(x, bestStr)).sort((a, b) => (b.t - a.t) || b.v - a.v)[0];
  if (oppsAfter.length && higherOut(myBest)) return t("whyLaterBeat", { n:nameOf(oppsAfter[0]) });
  return t("whyNotWorth", { p:trickPts });
}
function explainBury(buried, hand, ctx){

function onCardTap(c){
  const a = G.asking; if (!a) return;
  const r = R(); const hand = r.hands[a.seat];
  if (["reveal", "anti", "dealCheck", "forceCall"].includes(a.kind)) return;
  if (G.sel.has(c.id)){ G.sel.delete(c.id); sndPick(); G.msg = ""; renderDock(); return; }
  const limit = a.kind === "bury" ? 8 : a.kind === "follow" ? a.data.lead.n : 99;
  if (G.sel.size >= limit){ sndBad(); return; }
  G.sel.add(c.id);
  // grab the twin when building pairs (lead, or a lead that contains pairs)
  const wantsPairs = a.kind === "lead" || (a.kind === "follow" && a.data.lead.pairs > 0);
  if (wantsPairs && G.sel.size < limit){
    const twin = hand.find(x => x.id !== c.id && x.s === c.s && x.r === c.r && !G.sel.has(x.id));
    if (twin) G.sel.add(twin.id);
  }
  G.msg = ""; sndPick(); renderDock();
}

/* computer names for the seats that are computers: a typed name wins,
   otherwise the difficulty's default; duplicates get numbered (Robo-Bryan 2) */
function cpuNamesFor(isCpu){
  const out = {}, taken = new Set();
  for (let s = 0; s < 4; s++) if (!isCpu(s)){ const h = s === 0 && setupStep === "solo" ? S.soloName : S.passSeats[s].name; if (h && h.trim()) taken.add(h.trim().toLowerCase()); }
  // every copy of a shared name gets a number (Robo-Bryan 1, Robo-Bryan 2),
  // so a bare name in the log is never ambiguous
  const seats = [1, 2, 3, 0].filter(isCpu);
  const baseOf = (s) => (S.cpuNames[s] || "").trim() || CPU_NAMES[S.cpuDiff[s]];
  const count = {}; for (const s of seats){ const b = baseOf(s).toLowerCase(); count[b] = (count[b] || 0) + 1; }
  const next = {};
  for (const s of seats){
    const base = baseOf(s), key = base.toLowerCase();
    let name = base;
    if (count[key] > 1 || taken.has(key)){ let n = next[key] || 1; do { name = base + " " + n++; } while (taken.has(name.toLowerCase())); next[key] = n; }
    taken.add(name.toLowerCase()); out[s] = name;
  }
  return out;
}
function startSolo(){

async function runMatch(run, snap){
  try {
    while (G.M.winner == null){
      const io = makeIO(run);
      let s;
      if (snap){ const sn = snap; snap = null; s = await resumeRound(G.M, sn, io); }
      else s = await playRound(G.M, io);
      if (run !== G.run) return;
      G.roundOver = true;
      logRoundEnd(s);
      G.endInfo = { key:s.round, summary:s, over:G.M.winner != null, dealt:R() && R().dealt ? R().dealt.map(a => a.slice()) : null };
      startRoundReview(G.M.R, s);   // replays the round in the background for the review
      saveMatch();
      if (G.M.winner != null) break;
      await showRoundEnd(s, run, false, G.endInfo.dealt);
    }
    if (run === G.run){ const last = G.M.history[G.M.history.length - 1]; await showRoundEnd(last, run, true, G.endInfo && G.endInfo.dealt); }
  } catch (e){
    if (e !== CANCEL) { console.error(e); G.msg = "error: " + e.message; G.msgWarn = true; renderAll(); }
  }
}

/* ---------- round review (Nov 21) ----------
   highlights (the 3 most relevant awards, each tied to its trick, plus
   coaching on your own plays), a play-by-play, and the dealt hands. the
   analysis runs in the background (review.js) and fills in when ready.
   a view only: it never advances the round. */
function startRoundReview(R, s){
  if (G.reviewJob) G.reviewJob.cancel();
  G.review = { round:s.round, status:"working", pct:0, data:null };
  const over = G.M.winner != null;
  G.reviewJob = REVIEW.start(R, s, (rv) => {
    if (!G.review || G.review.round !== s.round) return;
    G.reviewHist = G.reviewHist || [];
    if (rv){ G.reviewHist.push({ round:s.round, awards:rv.awards, impact:rv.impact }); if (over) rv.recap = buildRecap(G.reviewHist); }
    G.review.status = "done"; G.review.data = rv;
    if (G.endInfo && G.endInfo.key === s.round) G.endInfo.review = rv;
    netDirty(); refreshReview();
  }, (p) => { if (G.review && G.review.round === s.round){ G.review.pct = p; if (revOpen()) refreshReview(); } });
}
/* match recap: the best gamble and costliest play of the match, and the MVP over all rounds */
function buildRecap(hist){
  let gamble = null, mistake = null; const imp = [0, 0, 0, 0];
  for (const h of hist){
    for (const a of h.awards){
      if (a.type === "gamble" && (!gamble || a.rel > gamble.rel)) gamble = Object.assign({ round:h.round }, a);
      if (a.type === "mistake" && (!mistake || a.cost > mistake.cost)) mistake = Object.assign({ round:h.round }, a);
    }
    (h.impact || []).forEach((x, p) => { imp[p] += x; });
  }
  const mvp = [0, 1, 2, 3].sort((a, b) => imp[b] - imp[a])[0];
  return { gamble, mistake, mvp, rounds:hist.length };
}

/* the chosen player's hand going into this trick: what they played, what was legal, and the better play when the review found one */
function handAtTrick(T, data, ctx, C){
  const box = document.createElement("div"); box.className = "rvhandbox";
  if (C.handSeat == null) C.handSeat = coachSeats()[0] || 0;
  const seat = C.handSeat;
  const chips = document.createElement("div"); chips.className = "rvseats";
  for (const p of T.plays.map(x => x.seat)){

    b.addEventListener("click", (e) => { e.stopPropagation(); C.handSeat = p; refreshReview(); }); chips.appendChild(b);
  }
  box.appendChild(chips);
  const gone = new Set();
  for (const U of data.tricks){ if (U.t >= T.t) break; for (const p of U.plays) if (p.seat === seat) p.ids.forEach(id => gone.add(id)); }
  const hand = data.start[seat].filter(id => !gone.has(id)).map(id => CARDS[id]);

  const mk = data.marks && data.marks[T.t + ":" + k];
  const note = ((data.coach && data.coach[seat]) || []).find(n => n.t === T.t);
  const better = new Set((mk && mk.better) || (note && note.better) || []);
  let usable = null;
  if (k > 0){
    const lead = classifyLead(T.plays[0].ids.map(id => CARDS[id]), ctx);
    const hs = hand.filter(c => effSuit(c, ctx) === lead.eff);
